<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#79D6F5">
<title>PEPELIKAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* ═══ PEPELIKAN 2.0 — cartoon adventure palette ═══ */
  --sky-top:#79D6F5; --sky-mid:#AEE9FA; --sky-low:#FFE7B8;
  --ocean:#2BB4C9; --ocean-deep:#1487A3; --ocean-fizz:#8FF0E6;
  --sand:#FCE3AE; --sand-dark:#F0C271;
  --palm:#3AAE63; --palm-dark:#237A45; --leaf:#5FC77E;
  --coral:#FF8A73; --coral-dark:#F0604A;
  --gold:#FFC63D; --gold-dark:#F2A007;
  --purple:#A98BF5; --purple-dim:#7C5CE0;
  --cyan:#33C7D6; --pink:#FF6FA8;
  --neon:#3FC97A; --neon-dim:#28A860; /* warm leaf-green replaces acid neon */
  --pepe-lit:#FFE9D6; --pepe-dark:#F3C9A6;
  --beak:#FFA23C; --beak-lit:#FFC172;
  --ink:#8A6A4A; --ink-soft:#C9A876; --txt:#5B4230; --txt-soft:#9A8069;
  --cream:#FFFBF3; --cream-2:#FFF3DE;
  --glass:#FFFFFFB8; --glass-line:#ffffffd0;
  --r:24px; --bd:0px;
  --surf:linear-gradient(165deg,#FFFFFFF5,#FFF6E6F0);
  --surf-line:#ffffffee;
  --shadow-soft:0 16px 32px -16px #7A5B3A38,0 2px 0 #ffffffcc inset;
  --shadow-float:0 10px 22px -10px #7A5B3A2e,0 1px 0 #ffffffcc inset;
  --ease:cubic-bezier(.22,1,.36,1);
}
/* ═══ chrome: glass panels, badges, sheets ═══ */
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--glass-line)}
.iconbtn{width:42px;height:42px;flex:0 0 auto;border-radius:16px;border:none;
  background:var(--glass);backdrop-filter:blur(8px);box-shadow:var(--shadow-float);font-size:17px;display:grid;place-items:center;cursor:pointer;position:relative;
  transition:transform .15s var(--ease)}
.iconbtn:active{transform:scale(.9)}
.iconbtn i{position:absolute;top:-2px;right:-2px;width:11px;height:11px;background:var(--coral);
  border:2px solid #fff;border-radius:50%;display:none}
.iconbtn.dot i{display:block}
.headicons{display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;gap:3px;font-family:'Fredoka';font-weight:600;font-size:9.5px;
  padding:4px 9px;border-radius:10px;border:none;background:var(--cream-2);color:var(--txt);letter-spacing:.2px}
.badge.gold{background:linear-gradient(var(--gold),var(--gold-dark));color:#4A2E00}
.badge.purple{background:linear-gradient(var(--purple),var(--purple-dim));color:#fff}
.counter{transition:color .2s}
.counter.up{color:var(--palm-dark)}
/* bottom sheet */
.sheetmask{position:fixed;inset:0;background:#5B3A1E4a;display:none;z-index:55;backdrop-filter:blur(3px)}
.sheetmask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#FFFDF7,#FFF3DE);
  border:none;border-radius:28px 28px 0 0;
  box-shadow:0 -10px 36px #7A5B3A33;max-height:82dvh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheetmask.on .sheet{transform:translateY(0)}
.sheet .grip{width:40px;height:5px;background:#D8BB8E;border-radius:3px;margin:10px auto 2px}
.sheet .shd{display:flex;align-items:center;padding:6px 14px 4px;gap:8px}
.sheet .shd h2{font-family:'Fredoka';font-weight:600;font-size:15px;margin:0;flex:1;color:var(--txt)}
.sheet .shx{width:32px;height:32px;border-radius:11px;border:none;background:var(--cream-2);
  display:grid;place-items:center;cursor:pointer;font-size:13px;color:var(--txt)}
.sheet .sbody{overflow-y:auto;padding:8px 14px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
/* type badges */
.ty{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-family:'Fredoka';font-weight:600;padding:3px 7px;
  border-radius:9px;border:none}
.ty-fire{background:#FFE0D6;color:#D9552E}.ty-water{background:#D6EFFB;color:#1A87B8}
.ty-nature{background:#DFF3DE;color:#2E8C4A}.ty-electric{background:#FFF2C2;color:#B8860A}
.ty-ice{background:#DBF7F2;color:#1A9E93}.ty-shadow{background:#EAE0FA;color:#7A4FCB}
.ty-light{background:#FFF0D2;color:#C98A12}.ty-wind{background:#DDF7EA;color:#22A171}
/* combo */
.combowrap{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:6px}
.combodot{width:34px;height:34px;border-radius:12px;border:none;background:var(--cream-2);
  display:grid;place-items:center;font-size:16px;opacity:.55;transition:all .2s}
.combodot.hit{opacity:1;background:linear-gradient(var(--gold),var(--gold-dark));transform:scale(1.14) rotate(-4deg);box-shadow:0 6px 14px -4px #F2A00788}
.tapmult{position:absolute;top:8px;right:10px;font-family:'Fredoka';font-weight:600;font-size:14px;color:#fff;
  background:linear-gradient(var(--coral),var(--coral-dark));padding:3px 10px;border-radius:12px;box-shadow:0 4px 10px -4px #F0604A88;opacity:0;transition:opacity .2s}
.tapmult.on{opacity:1}
/* profile / titles */
.titlepick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tpk{border:none;border-radius:15px;background:var(--cream-2);padding:9px 6px;text-align:center;
  cursor:pointer;font-family:'Fredoka';font-weight:600;font-size:10.5px;color:var(--txt);box-shadow:var(--shadow-float)}
.tpk.on{background:linear-gradient(var(--purple),var(--purple-dim));color:#fff}
.tpk.locked{opacity:.45;filter:grayscale(.5);cursor:default;box-shadow:none}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stg{background:var(--cream-2);border:none;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--shadow-float)}
.stg b{display:block;font-family:'Fredoka';font-weight:600;font-size:16px;color:var(--palm-dark)}
.stg span{font-size:9px;opacity:.65;text-transform:uppercase;letter-spacing:.4px;color:var(--txt-soft)}
.teamrow{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.tmem{width:54px;text-align:center}
.tmem .em{font-size:26px;border:none;border-radius:15px;background:var(--cream-2);
  display:grid;place-items:center;height:50px;box-shadow:var(--shadow-float)}
.tmem .em svg{width:36px;height:36px}
.tmem .hp{height:5px;border-radius:3px;background:#0000000f;margin-top:3px;overflow:hidden}
.tmem .hp i{display:block;height:100%;background:linear-gradient(90deg,var(--neon),var(--neon-dim))}
.filtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:9px;padding-bottom:2px}
.filtabs::-webkit-scrollbar{display:none}
.filtabs button{flex:0 0 auto;font-family:'Fredoka';font-weight:600;font-size:10px;padding:8px 12px;border:none;
  border-radius:12px;background:var(--cream-2);color:var(--txt);cursor:pointer}
.filtabs button.on{background:linear-gradient(var(--coral),var(--coral-dark));color:#fff}
.dexlock{filter:grayscale(1) brightness(.7) opacity(.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:800;color:var(--txt);background:var(--sky-mid);
  user-select:none;-webkit-user-select:none}
.dsp{font-family:'Fredoka',cursive;font-weight:600;letter-spacing:.2px}

/* ═══ living island world ═══ */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.cloud{animation:drift 46s linear infinite;opacity:.9}
.cloud.c2{animation-duration:64s;animation-delay:-20s;opacity:.7}
.cloud.c3{animation-duration:38s;animation-delay:-9s;opacity:.65}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
.wave{animation:sway 6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-22px)}}
.bird-fly{animation:soar 20s linear infinite;opacity:.8}
@keyframes soar{from{transform:translate(-40px,20px)}to{transform:translate(460px,-40px)}}
#sun{animation:glow 6s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.78}}
.sparkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.palmsway{animation:palmwind 4.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes palmwind{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}

/* ═══ shell ═══ */
#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.on{display:block;animation:slide .24s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ hud ═══ */
.hud{flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;position:relative;z-index:3}
.hud::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#FFFDF9E6,#FFFDF9A0 80%,#FFFDF900);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  pointer-events:none;z-index:-1}
.idrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ava{width:46px;height:46px;flex:0 0 auto;border-radius:16px;border:3px solid #fff;
  background:linear-gradient(155deg,var(--pepe-lit),var(--pepe-dark));box-shadow:var(--shadow-float);
  display:grid;place-items:center;font-size:22px;overflow:hidden}
.ava svg{width:38px;height:38px}
.who{flex:1;min-width:0}
.nick{font-size:15px;line-height:1;color:var(--txt);font-family:'Fredoka';font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpwrap{display:flex;align-items:center;gap:5px;margin-top:6px}
.xpbar{flex:1;height:9px;border:none;border-radius:6px;background:#ffffffb0;overflow:hidden;box-shadow:inset 0 1px 3px #0000000f}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold));
  transition:width .5s var(--ease)}
.xptxt{font-size:9px;opacity:.7;color:var(--txt-soft)}
.lvl{font-size:12px;font-family:'Fredoka';font-weight:600;background:linear-gradient(155deg,var(--gold),var(--gold-dark));border:none;
  border-radius:14px;padding:7px 11px;box-shadow:var(--shadow-float);color:#4A2E00}
.gear{width:42px;height:42px;flex:0 0 auto;border-radius:16px;border:none;
  background:var(--glass);backdrop-filter:blur(8px);box-shadow:var(--shadow-float);font-size:17px;display:grid;place-items:center;cursor:pointer;
  transition:transform .15s var(--ease)}
.gear:active{transform:scale(.92)}
.bals{display:flex;gap:7px}
.bal{flex:1;min-width:0;background:var(--glass);border:none;border-radius:16px;
  box-shadow:var(--shadow-float);padding:7px 4px;text-align:center;position:relative;overflow:hidden;
  transition:transform .15s var(--ease)}
.bal b{display:block;font-family:'Fredoka';font-weight:600;font-size:13px;line-height:1.25;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.bal span{font-size:8px;opacity:.6;letter-spacing:.5px;text-transform:uppercase;color:var(--txt-soft)}
.bal.flash{transform:scale(1.06)}
.bal.flash::after{content:'';position:absolute;inset:0;background:radial-gradient(circle,var(--gold),transparent 70%);opacity:.5;animation:fade .6s ease-out forwards}
@keyframes fade{to{opacity:0}}
.buffs{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.buff{font-size:10px;font-family:'Fredoka';font-weight:600;background:linear-gradient(155deg,var(--pink),#D14C86);color:#fff;border:none;
  border-radius:11px;padding:4px 9px;box-shadow:0 4px 10px -4px #FF6FA888}

/* ═══ cards ═══ */
.card{background:var(--surf);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);
  border:none;border-radius:var(--r);
  box-shadow:var(--shadow-soft);padding:16px;margin-bottom:13px;position:relative;overflow:hidden;
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,#fff0,#ffffffcc,#fff0);pointer-events:none}
.card h3{font-family:'Fredoka';font-weight:600;font-size:13.5px;margin:0 0 11px;letter-spacing:.2px;
  display:flex;align-items:center;gap:6px;color:var(--txt)}
.card h3 em{font-style:normal;margin-left:auto;font-size:10.5px;opacity:.6;font-family:'Nunito';color:var(--txt-soft)}
.muted{font-size:12px;font-weight:700;opacity:.75;line-height:1.5;color:var(--txt-soft)}

.btn{font-family:'Fredoka';font-weight:600;font-size:15px;letter-spacing:.2px;
  background:linear-gradient(155deg,var(--coral),var(--coral-dark) 85%);border:none;border-radius:18px;
  box-shadow:0 8px 18px -8px #F0604A66,inset 0 1px 0 #ffffff70,0 3px 0 #D9482f4a;padding:14px 14px;cursor:pointer;width:100%;color:#fff;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),filter .16s}
.btn:active:not(:disabled){transform:translateY(3px) scale(.985);box-shadow:0 2px 6px -2px #F0604A55,inset 0 1px 0 #ffffff40}
.btn.green{background:linear-gradient(155deg,var(--neon),var(--neon-dim) 85%);color:#fff;box-shadow:0 8px 18px -8px #28A86066,inset 0 1px 0 #ffffff70,0 3px 0 #1c7a4650}
.btn.green:active:not(:disabled){box-shadow:0 2px 6px -2px #28A86055,inset 0 1px 0 #ffffff40}
.btn.pink{background:linear-gradient(155deg,var(--pink),#D14C86 85%);color:#fff;box-shadow:0 8px 18px -8px #FF6FA866,inset 0 1px 0 #ffffff60,0 3px 0 #b23a6a4a}
.btn.pink:active:not(:disabled){box-shadow:0 2px 6px -2px #FF6FA855,inset 0 1px 0 #ffffff40}
.btn.pale{background:linear-gradient(155deg,#fff,var(--cream-2) 85%);color:var(--txt);box-shadow:0 6px 14px -8px #7A5B3A33,inset 0 1px 0 #ffffffcc,0 3px 0 #e8d3ab8a}
.btn:disabled{filter:grayscale(.6);opacity:.5;cursor:default}
.btn+.btn{margin-top:8px}

/* ═══ stage ═══ */
.stage{position:relative;height:266px;display:grid;place-items:center}
.heroWrap{position:relative;width:236px;height:236px;display:grid;place-items:center;cursor:pointer}
.heroWrap::after{content:'';position:absolute;bottom:0px;left:50%;transform:translateX(-50%);
  width:66%;height:20px;border-radius:50%;background:radial-gradient(ellipse,#2B4A2A55,#2B4A2A00 72%);
  animation:shd 2.6s steps(1) infinite;z-index:-1}
.heroReal{width:100%;height:100%;object-fit:cover;border-radius:50%;
  border:5px solid #fff;box-shadow:0 16px 32px -10px #7A5B3A40,0 0 0 8px #FFC63D33,inset 0 2px 6px #ffffff40;
  transform-origin:50% 62%;animation:bob 2.6s steps(1) infinite}
@keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#bird.hit{animation:squash .2s steps(1)}
@keyframes squash{0%{transform:none}50%{transform:scaleY(.92) translateY(1px)}100%{transform:none}}
.pop{position:absolute;font-family:'Fredoka';font-weight:600;font-size:21px;color:var(--coral-dark);z-index:5;
  text-shadow:0 2px 0 #fff,0 4px 8px #0000001a;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}
  25%{transform:translate(calc(var(--dx)*.4),-34px) scale(1.25)}
  100%{opacity:0;transform:translate(var(--dx),-96px) scale(1)}}
.fishjump{position:absolute;font-size:26px;pointer-events:none;animation:jump 1.1s ease-out forwards;z-index:5}
@keyframes jump{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-84px) rotate(340deg)}}
.tapmeter{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;
  background:#ffffffb0;padding:3px 10px;border-radius:10px;color:var(--txt-soft)}
.slog{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-family:'Fredoka';font-weight:600;font-size:11.5px;
  color:#fff;background:linear-gradient(155deg,var(--coral),var(--coral-dark));padding:4px 12px;border-radius:12px;
  letter-spacing:1px;box-shadow:0 6px 14px -6px #F0604A66}

/* ═══ bars ═══ */
.enwrap{display:flex;align-items:center;gap:9px}
.enbar{flex:1;height:19px;border:none;border-radius:10px;background:#ffffffb0;overflow:hidden;box-shadow:inset 0 1px 3px #0000000f}
.enbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--beak));
  transition:width .3s}
.entxt{font-family:'Fredoka';font-weight:600;font-size:12.5px;white-space:nowrap;color:var(--txt)}
.prog{height:10px;border:none;border-radius:6px;background:#ffffffb0;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--palm),var(--leaf));transition:width .3s}

/* ═══ rows ═══ */
.row{display:flex;align-items:center;gap:10px;padding:9px;border:none;border-radius:17px;
  background:var(--cream-2);margin-bottom:8px;position:relative;overflow:hidden;box-shadow:var(--shadow-float)}
.row:last-child{margin-bottom:0}
.row.locked{opacity:.5;filter:grayscale(.5)}
.row .ic{width:46px;height:46px;flex:0 0 auto;border-radius:15px;border:none;background:#fff;
  display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow-float)}
.row .mid{flex:1;min-width:0}
.row .ttl{font-family:'Fredoka';font-weight:600;font-size:13px;letter-spacing:.1px;color:var(--txt)}
.row .sub{font-size:11px;font-weight:700;opacity:.75;margin-top:3px;line-height:1.4;color:var(--txt-soft)}
.mini{font-family:'Fredoka';font-weight:600;font-size:11.5px;padding:11px 12px;border:none;
  border-radius:14px;background:linear-gradient(var(--gold),var(--gold-dark));box-shadow:0 3px 0 #D18E00;
  cursor:pointer;white-space:nowrap;color:#4A2E00;flex:0 0 auto}
.mini:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
.mini:disabled{filter:grayscale(.6);opacity:.5}
.mini.g{background:linear-gradient(var(--neon),var(--neon-dim));color:#fff;box-shadow:0 3px 0 #1c7a46}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.res div{background:var(--cream-2);border:none;border-radius:13px;padding:6px 2px;text-align:center;box-shadow:var(--shadow-float)}
.res span{display:block;font-size:18px;line-height:1.25}
.res b{font-size:10.5px;font-family:'Fredoka';font-weight:600;color:var(--txt)}

/* ═══ inventory ═══ */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{aspect-ratio:1;border:none;border-radius:15px;position:relative;background:var(--cream-2);box-shadow:var(--shadow-float);
  display:grid;place-items:center;font-size:22px;cursor:pointer;overflow:hidden}
.it.eq::before{content:'';position:absolute;inset:0;box-shadow:0 0 0 3px var(--neon) inset;border-radius:12px}
.it .lv{position:absolute;bottom:2px;right:5px;font-size:9px;font-family:'Fredoka';font-weight:600;color:var(--txt-soft)}
.it .st{position:absolute;top:2px;left:5px;font-size:9px;font-family:'Fredoka';font-weight:600;opacity:.8;color:var(--txt-soft)}
.shine::after{content:'';position:absolute;top:-60%;left:-60%;width:40%;height:220%;
  background:linear-gradient(90deg,#fff0,#ffffffc0,#fff0);transform:rotate(24deg);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:9px}
.slot{border:2px dashed #E8CE9E;border-radius:15px;background:var(--cream-2);padding:9px 4px;text-align:center;min-width:0}
.slot b{display:block;font-size:8.5px;text-transform:uppercase;opacity:.55;letter-spacing:.5px;color:var(--txt-soft)}
.slot em{display:block;font-family:'Fredoka';font-weight:600;font-style:normal;font-size:10.5px;margin-top:4px;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i{font-style:normal;font-size:10px;opacity:.65;color:var(--txt-soft)}
.r0{background:linear-gradient(155deg,#EFE6D8,#DCCBB0)}
.r1{background:linear-gradient(155deg,#CFEFD6,#9FDCAE)}
.r2{background:linear-gradient(155deg,#CDEBF8,#8FCBE8)}
.r3{background:linear-gradient(155deg,#E5D6FA,#C1A3EE)}
.r4{background:linear-gradient(155deg,#FFE9B0,#FFC96B)}
.r5{background:linear-gradient(155deg,#FFD3CB,#FF9E8F)}
.r6{background:linear-gradient(135deg,#FFC6E8,#C9E7FF,#FFEFB0);background-size:300% 300%;animation:unusual 3s ease infinite}
.rt0{color:#9A8069}.rt1{color:#2E8C4A}.rt2{color:#1A87B8}
.rt3{color:#7C5CE0}.rt4{color:#C98A12}.rt5{color:#E85A4A}.rt6{background:linear-gradient(90deg,#E85A9E,#4FB8D6,#F2A007,#E85A9E);background-size:300% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:unusual 2.4s linear infinite}
@keyframes unusual{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ═══ pelicans & bosses ═══ */
.bossrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:9px;-webkit-overflow-scrolling:touch}
.bossrow::-webkit-scrollbar{display:none}
.bch{flex:0 0 auto;width:62px;text-align:center;padding:8px 3px 7px;border:none;border-radius:17px;
  background:var(--cream-2);cursor:pointer;position:relative;box-shadow:var(--shadow-float)}
.bch.on{background:linear-gradient(#FFE9B0,#FFD37A);box-shadow:0 0 0 2px var(--gold-dark) inset}
.bch.locked{opacity:.45;filter:grayscale(.5)}
.bch .em{font-size:25px;line-height:1.2}
.bch .nm{font-size:8.5px;font-family:'Fredoka';font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.bch .dn{position:absolute;top:3px;right:5px;font-size:10px}
.stamwrap{margin:9px 0 2px}
.stamlabel{font-size:9.5px;opacity:.65;letter-spacing:.4px;margin-bottom:3px;font-family:'Fredoka';font-weight:600;color:var(--txt-soft)}
.stambar{height:14px;border:none;border-radius:8px;background:#ffffffb0;overflow:hidden}
.stambar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--ocean-deep));transition:width .3s}
.stambar i.full{background:linear-gradient(90deg,var(--gold),var(--coral))}
.actrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}
.actrow button{font-family:'Fredoka';font-weight:600;font-size:11px;padding:11px 4px;border:none;
  border-radius:14px;background:var(--cream-2);box-shadow:0 4px 0 #E8D3AB;cursor:pointer;color:var(--txt)}
.actrow button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0}
.actrow button:disabled{filter:grayscale(.6);opacity:.45}
.actrow button.a-atk{background:linear-gradient(var(--neon),var(--neon-dim));color:#fff;box-shadow:0 4px 0 #1c7a46}
.actrow button.a-pow{background:linear-gradient(var(--pink),#D14C86);color:#fff;box-shadow:0 4px 0 #b23a6a}
.actrow button.a-def{background:linear-gradient(var(--cyan),var(--ocean-deep));color:#fff;box-shadow:0 4px 0 #0e6a80}
.actrow button.a-ult{background:linear-gradient(var(--gold),var(--gold-dark));color:#4A2E00;box-shadow:0 4px 0 #D18E00}
.trait{display:inline-block;font-size:9.5px;font-family:'Fredoka';font-weight:600;background:#fff;border:none;border-radius:9px;padding:3px 7px;margin-left:4px;color:var(--txt-soft);box-shadow:var(--shadow-float)}
.pk{border:none;border-radius:18px;background:var(--cream-2);padding:10px 7px;text-align:center;cursor:pointer;position:relative;box-shadow:var(--shadow-float)}
.pk.on{background:linear-gradient(#FFE9B0,#FFD37A);box-shadow:0 0 0 2px var(--gold-dark) inset}
.pk.locked{opacity:.6}
.pk .em{font-size:30px;line-height:1.2}
.pk .em svg{width:44px;height:44px}
.pk .nm{font-family:'Fredoka';font-weight:600;font-size:10px;margin:5px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.pk .tier{font-size:8.5px;opacity:.8;text-transform:uppercase;letter-spacing:.3px;color:var(--txt-soft)}
.pk .pr{font-size:9.5px;opacity:.75;margin-top:2px;color:var(--txt-soft)}
.pk .own{position:absolute;top:6px;right:8px;font-size:12px}
.pk .lv{position:absolute;top:6px;left:8px;font-size:9px;font-family:'Fredoka';font-weight:600;opacity:.85;color:var(--txt-soft)}
.eggrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.egg{border:none;border-radius:18px;background:linear-gradient(180deg,#FFF6E6,#FFEBC8);padding:13px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow-float)}
.egg .em{font-size:40px}
.egg .nm{font-family:'Fredoka';font-weight:600;font-size:11.5px;margin:6px 0 2px;color:var(--txt)}
.egg .pr{font-size:10.5px;opacity:.8;color:var(--txt-soft)}
.egg .pity{font-size:8.5px;opacity:.6;margin-top:3px;color:var(--txt-soft)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ═══ tabs ═══ */
.tabs{display:flex;gap:7px;margin-bottom:11px}
.tabs button{flex:1;font-family:'Fredoka';font-weight:600;font-size:11.5px;padding:11px 4px;border:none;
  border-radius:15px;background:var(--cream-2);box-shadow:0 4px 0 #E8D3AB;cursor:pointer;color:var(--txt)}
.tabs button.on{background:linear-gradient(var(--coral),var(--coral-dark));color:#fff;box-shadow:0 4px 0 #C94736}
.tabs button:active{transform:translateY(4px);box-shadow:0 0 0}
.pane{display:none}.pane.on{display:block}

/* ═══ combat ═══ */
.bosswrap{position:relative;height:150px;display:grid;place-items:center;margin-bottom:8px;
  background:linear-gradient(180deg,#FFE3D6,#FFD0C2);border-radius:20px}
.bossface{font-size:84px;filter:drop-shadow(0 8px 12px #0000001a)}
.bossface.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:none}25%{transform:translate(-9px,3px) rotate(-6deg)}75%{transform:translate(9px,-3px) rotate(6deg)}}
.hpbar{height:26px;border:none;border-radius:13px;background:#ffffffb0;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(var(--pink),#D14C86);transition:width .4s}
.hpbar.mine i{background:linear-gradient(var(--neon),var(--neon-dim))}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:'Fredoka';font-weight:600;font-size:11.5px;
  color:#fff;text-shadow:0 1px 3px #0000004a}
.phase{display:flex;gap:4px;margin-top:6px}
.phase i{flex:1;height:5px;border-radius:3px;background:#ffffffa0}
.phase i.on{background:var(--pink)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.fighter{text-align:center;min-width:0}
.fighter .face{font-size:42px}
.fighter .nm{font-family:'Fredoka';font-weight:600;font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.vs{font-family:'Fredoka';font-weight:600;font-size:18px;color:var(--coral-dark)}
.log{background:var(--cream-2);border:none;border-radius:16px;padding:9px 11px;
  font-size:11.5px;height:120px;overflow-y:auto;line-height:1.65;color:var(--txt)}
.log div{animation:logIn .25s ease-out}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ═══ shop ═══ */
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{border:none;border-radius:18px;background:var(--cream-2);padding:10px 7px;text-align:center;
  cursor:pointer;position:relative;box-shadow:var(--shadow-float)}
.sk.on{background:linear-gradient(#FFE9B0,#FFD37A);box-shadow:0 0 0 2px var(--gold-dark) inset}
.sk .em{font-size:29px;line-height:1.25}
.sk .nm{font-family:'Fredoka';font-weight:600;font-size:10.5px;margin:5px 0 2px;color:var(--txt)}
.sk .pr{font-size:10.5px;opacity:.75;color:var(--txt-soft)}
.sk .own{position:absolute;top:6px;right:8px;font-size:11px}

/* ═══ nav ═══ */
nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;
  margin:0 10px calc(8px + env(safe-area-inset-bottom));padding:8px 6px;
  background:#FFFDF9EE;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:none;border-radius:26px;box-shadow:0 -4px 0 #0000000a inset,0 18px 36px -16px #7A5B3A40;position:relative;z-index:3}
nav button{position:relative;font-family:'Fredoka';font-weight:600;font-size:8.4px;letter-spacing:0;
  background:transparent;border:none;border-radius:17px;box-shadow:none;
  padding:8px 1px;cursor:pointer;color:#B49675;transition:transform .22s var(--ease),background .22s,color .22s,box-shadow .22s}
nav button span{display:block;font-size:19px;line-height:1.2;transition:transform .22s var(--ease)}
nav button.on{background:linear-gradient(155deg,var(--coral),var(--coral-dark));color:#fff;transform:translateY(-5px);
  box-shadow:0 10px 20px -8px #F0604A66}
nav button.on span{transform:scale(1.1)}
nav button:active{transform:scale(.92)}
nav button i{position:absolute;top:2px;right:10px;width:10px;height:10px;background:var(--coral-dark);
  border:2px solid #fff;border-radius:50%;display:none}
nav button.dot i{display:block}

/* ═══ modal ═══ */
.mask{position:fixed;inset:0;background:#5B3A1E4a;display:none;place-items:center;padding:18px;z-index:50;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mask.on{display:grid}
.modal{background:linear-gradient(165deg,#FFFDF9,#FFF3DE);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border:none;border-radius:28px;
  box-shadow:0 26px 60px -18px #7A5B3A55,0 0 60px #FFC63D22;padding:20px;width:100%;max-width:360px;max-height:88dvh;
  overflow-y:auto;animation:pop .3s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-family:'Fredoka';font-weight:600;font-size:19px;margin:0 0 6px;text-align:center;
  color:var(--txt)}
.rays{position:relative;height:100px;display:grid;place-items:center;margin:4px 0;pointer-events:none}
.rays::before{content:'';position:absolute;width:190px;height:190px;
  background:conic-gradient(from 0deg,#FFC63D 0 10deg,#fff0 10deg 30deg);border-radius:50%;
  animation:spin 9s linear infinite;opacity:.32;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rays .em{position:relative;font-size:56px;animation:pop2 .5s cubic-bezier(.3,1.7,.5,1);pointer-events:none}
.rays .em svg{width:80px;height:80px}
@keyframes pop2{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.day{border:none;border-radius:14px;background:var(--cream-2);padding:7px 2px;text-align:center;font-size:10px;color:var(--txt-soft)}
.day.done{background:linear-gradient(var(--neon),var(--neon-dim));color:#fff}
.day.now{background:linear-gradient(var(--gold),var(--gold-dark));color:#4A2E00;animation:bump 1.1s ease-in-out infinite}
@keyframes bump{0%,100%{transform:none}50%{transform:scale(1.08)}}
.day b{display:block;font-family:'Fredoka';font-weight:600;font-size:13px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.lg{border:none;border-radius:15px;background:var(--cream-2);padding:11px 6px;
  text-align:center;cursor:pointer;font-family:'Fredoka';font-weight:600;font-size:11px;color:var(--txt);box-shadow:var(--shadow-float)}
.lg.on{background:linear-gradient(var(--neon),var(--neon-dim));color:#fff}
.lg span{display:block;font-size:20px;margin-bottom:3px}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(760deg)}}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#fff;color:var(--txt);
  padding:11px 18px;border-radius:16px;font-size:12.5px;font-weight:800;z-index:60;opacity:0;transition:opacity .25s;
  pointer-events:none;max-width:88%;text-align:center;border:none;box-shadow:0 10px 28px -8px #7A5B3A40}
.toast.on{opacity:1}

/* ═══ splash ═══ */
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(180deg,#79D6F5,#AEE9FA 45%,#FFE7B8 100%);
  display:grid;place-items:center;transition:opacity .5s,visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
#splash .in{text-align:center}
#splash .logo{font-family:'Fredoka';font-weight:700;font-size:34px;color:#fff;letter-spacing:.5px;
  text-shadow:0 4px 0 #F0604A,0 8px 18px #7A5B3A40;animation:drop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
#splash .sub{font-family:'Fredoka';font-weight:600;font-size:11px;color:#fff;opacity:.95;letter-spacing:3px;margin-top:6px;
  text-shadow:0 2px 6px #7A5B3A40}
#splash .ld{width:150px;height:10px;border:none;border-radius:6px;background:#ffffff70;
  margin:18px auto 0;overflow:hidden;box-shadow:inset 0 1px 3px #0000001a}
#splash .ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--gold));animation:load 1.3s ease-out forwards}
@keyframes load{to{width:100%}}
#splash svg{width:132px;height:132px;animation:bob 2.4s ease-in-out infinite}
.splashArt{width:158px;height:158px;object-fit:cover;border-radius:50%;display:block;margin:0 auto;
  border:5px solid #fff;box-shadow:0 16px 34px -10px #7A5B3A40,0 0 0 8px #ffffff55;animation:bob 2.4s ease-in-out infinite}
.profAvatar{width:88px;height:88px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 10px;
  border:4px solid #fff;box-shadow:var(--shadow-float)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<div id="app">
  <header class="hud">
    <div class="idrow">
      <div class="ava" id="ava"></div>
      <div class="who">
        <div class="nick dsp" id="nick">PELICAN</div>

  <main>
    <!-- ═══ HOME ═══ -->

        <div id="pel" class="heroWrap">
          <img id="bird" class="heroReal" alt="Pepelikan">

      <div class="card">
        <h3>⚡ <b data-i="h_energy"></b> <em id="enhint"></em></h3>

/* ══════════ sound engine (WebAudio synth — no external assets) ══════════ */
let ACTX=null;
function actx(){if(!ACTX){try{ACTX=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ACTX;}
function beep(freq,dur,type,vol,delay){
  try{
    if(S.settings&&S.settings.sound===false)return;
    const ctx=actx();if(!ctx)return;
    if(ctx.state==='suspended')ctx.resume();
    const t0=ctx.currentTime+(delay||0);
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type=type||'square';osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol||.09,t0+.01);
    gain.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.12));
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t0);osc.stop(t0+(dur||.12)+.02);
  }catch(e){}
}

  defeat:()=>{beep(300,.18,'sawtooth',.06);beep(220,.22,'sawtooth',.06,.12);},
  levelup:()=>{[440,554,659,880].forEach((f,i)=>beep(f,.13,'square',.07,i*.07));},

};

let LI=0;
function t(k,...a){ const row=L[k]; if(!row) return k; let s=row[LI]||row[0];
  a.forEach((v,i)=>{ s=s.split('{'+i+'}').join(v); }); return s; }
function setLang(code){
  const i=LANGS.findIndex(x=>x.c===code); LI=i<0?0:i; S.lang=LANGS[LI].c;
  document.documentElement.lang=S.lang; applyStatic(); paint(); save();
}
function applyStatic(){ document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent=t(el.dataset.i); }); }

/* ══════════ 2. PIXEL PELICAN ══════════ */
/* Vector cartoon PEPELIKAN mascot — a single reusable illustrated bird shape
   (rounded body, big eye, signature pouch beak) recolored per rarity/type via
   fill params. Replaces the old pixel-grid renderer everywhere: header avatar,
   team icons, collection cards, pelican detail, egg reveal. No pixel/ASCII art. */
const RARITY_VBIRD=[
  {body:'#F3E7D6',wing:'#E3D2B8'},   // 0 common — warm cream
  {body:'#CDEFD6',wing:'#9FDCAE'},   // 1 uncommon — soft green
  {body:'#CDE9F8',wing:'#8FCBE8'},   // 2 rare — soft blue
  {body:'#E5D6FA',wing:'#C1A3EE'},   // 3 epic — soft purple
  {body:'#FFE9B0',wing:'#FFC96B'},   // 4 legendary — gold
  {body:'#FFD3CB',wing:'#FF9E8F'},   // 5 exalted — coral
  {body:'#FFFFFF',wing:'#FFE1F2'}    // 6 mythic — pearl + holo overlay
];
const TYPE_ACCENT={fire:'#FF8A5C',water:'#6EC6FF',nature:'#7BC98F',electric:'#FFD65C',
  ice:'#8FE9DA',shadow:'#B79BEE',light:'#FFD97A',wind:'#7FE8C7'};
function vbirdSVG(r,ty,size){
  r=Math.max(0,Math.min(6,r||0));
  const pal=RARITY_VBIRD[r],accent=TYPE_ACCENT[ty]||'#F0A94E',holo=r>=6,uid='h'+r+(ty||'')+size;
  const bodyFill=holo?`url(#${uid})`:pal.body;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="vbird">
    ${holo?`<defs><linearGradient id="${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC6E8"/><stop offset="50%" stop-color="#C9E7FF"/><stop offset="100%" stop-color="#FFEFB0"/>
    </linearGradient></defs>`:''}
    <ellipse cx="50" cy="69" rx="29" ry="21" fill="${bodyFill}"/>
    <path d="M27 58Q9 61 14 81Q29 82 36 65Z" fill="${pal.wing}"/>
    <ellipse cx="41" cy="75" rx="12" ry="8.5" fill="#FFFBF3" opacity=".85"/>
    <circle cx="63" cy="39" r="19" fill="${bodyFill}"/>
    <path d="M60 43Q89 45 86 62Q69 65 57 51Z" fill="${accent}"/>
    <path d="M61 36L94 40Q90 46 62 46Z" fill="#FFA23C"/>
    <path d="M61 40L92 43Q88 48 61 46Z" fill="#F07D1A" opacity=".55"/>
    <circle cx="68.5" cy="32" r="5.6" fill="#fff"/><circle cx="70" cy="32" r="3" fill="#3E2A1E"/><circle cx="68.3" cy="30.5" r="1.1" fill="#fff"/>
  </svg>`;
}
function drawPel(){
  // Header avatar: the player's own vector mascot, tinted by the rarity/type of
  // their strongest pelican so it visibly grows with progress, with equipped
  // cosmetic skins layered on as small badge stickers ("drip" stays visible).
  const best=(S.peli||[]).reduce((m,p)=>{const d=pelDef(p);return d&&(!m||d.r>m.r)?d:m;},null);
  const r=best?best.r:0, ty=best?best.ty:'nature';
  const badges=['headwear','eyewear','neckwear'].map(slot=>{
    const id=S.skin[slot],sk=id&&CFG.skins.find(x=>x.id===id);return sk?sk.e:null;}).filter(Boolean);
  const badge=badges[0]?`<span style="position:absolute;top:-3px;right:-5px;font-size:14px;filter:drop-shadow(0 1px 2px #0004)">${badges[0]}</span>`:'';
  const ava=$('ava');
  if(ava) ava.innerHTML=`<span style="position:relative;display:grid;place-items:center">${vbirdSVG(r,ty,38)}${badge}</span>`;
}

      if(raw){const p=JSON.parse(raw);if(p&&typeof p==='object'&&p.v>=3)S=Object.assign(safeFresh(),p);}
    }catch(e){console.error('Save corrupted, starting fresh.',e);S=safeFresh();}

    cb();
  };
  try{if(TG&&TG.CloudStorage&&TG.CloudStorage.getItem){TG.CloudStorage.getItem(KEY,(e,v)=>apply(e?null:v));return;}}catch(e){}

const needXp=l=>Math.floor(90*Math.pow(l,1.42));

const companion=()=>S.pelEq?S.peli.find(p=>p.u===S.pelEq):null;
const pelDef=p=>p?CFG.pelicans.find(x=>x.id===p.id):null;
function teamMembers(){
  const seen=new Map();
  const c=companion(); if(c) seen.set(c.u,c);
  (S.team||[]).forEach(u=>{const p=S.peli.find(x=>x.u===u); if(p) seen.set(p.u,p);});
  return[...seen.values()];
}
function perkVal(type){
  return teamMembers().reduce((sum,c)=>{const d=pelDef(c);if(!d||d.perk.t!==type)return sum;
    return sum+d.perk.v*(1+(c.lv||0)*.08);},0);
}
const pelStat=(p,w)=>{const d=pelDef(p);if(!d)return 0;const R=CFG.pelicanRarity[d.r];
  const base=w==='atk'?2+d.r*2:w==='def'?1+d.r*1.4:1+d.r*.8;
  return Math.round(base*R.m*(1+(p.lv||0)*.18));};
const regRate=()=>(CFG.enPerMin+S.up.reg*.3)*(1+perkVal('energy')/100);
const equipped=()=>['weapon','armor','charm'].map(k=>S.inv.find(i=>i.u===S.eq[k])).filter(Boolean);
const itemStat=(it,w)=>Math.round(it[w]*(1+(it.lv||0)*.15));
function stats(){let atk=9+S.lvl*2+S.up.atk*3+(S.hq.camp||0)*2,def=5+S.lvl+S.up.atk+(S.hq.camp||0)*1.2,luck=3+S.up.luck*2;
  equipped().forEach(i=>{atk+=itemStat(i,'a');def+=itemStat(i,'d');luck+=i.l||0;});
  const c=companion();if(c){atk+=pelStat(c,'atk');def+=pelStat(c,'def');luck+=pelStat(c,'luck');}
  return{atk,def,luck,hp:70+S.lvl*24+def*4};}
function typeMult(myTy,foeTy){
  if(!myTy||!foeTy) return 1;
  const order=CFG.types,i=order.indexOf(myTy),j=order.indexOf(foeTy);
  if(i<0||j<0||i===j) return 1;
  const diff=(j-i+order.length)%order.length;
  if(diff===1||diff===2) return 1.25;
  if(diff===order.length-1||diff===order.length-2) return .8;
  return 1;
}
const buffOn=id=>(S.buff[id]||0)>Date.now();
function regen(){const now=Date.now(),m=(now-S.enTs)/60000;if(m<=0)return;const g=m*regRate();

  if(S.en>=enMax())S.enTs=now;}

  const tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(let i=0;i<w.length;i++)if((x-=w[i])<=0)return i;return 0;}
function makeItem(luck){const r=rollR(luck),kk=['weapon','armor','charm'][ri(0,2)],K=CFG.kinds[kk],R=CFG.rarity[r];

/* ══════════ 5b. daily combo (original mini-game, seeded by date) ══════════ */
function seedHash(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h;}
function dailySeq(){
  let s=seedHash(today());
  const rnd=()=>{s=(s*1103515245+12345)>>>0;return s/4294967295;};
  const pool=CFG.comboIcons.slice(),used=new Set(),seq=[];
  while(seq.length<3){const idx=Math.floor(rnd()*pool.length);if(!used.has(idx)){used.add(idx);seq.push(pool[idx]);}}
  const rest=pool.filter((_,i)=>!used.has(i)),distract=[];
  while(distract.length<3&&rest.length){const idx=Math.floor(rnd()*rest.length);distract.push(rest.splice(idx,1)[0]);}
  const bank=[...seq,...distract];
  for(let i=bank.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}
  return{seq,bank};
}
function renderDailyCombo(){
  if(S.dailyCombo.date!==today())S.dailyCombo={date:today(),prog:0,claimed:false};
  const{seq,bank}=dailySeq();
  $('combohint').textContent=S.dailyCombo.claimed?t('combo_already'):(S.dailyCombo.prog+'/3');
  $('comboRow').innerHTML=`
    <div style="display:flex;flex-direction:column;gap:8px;width:100%">
      <div class="muted" style="text-align:center;font-size:10.5px">${t('combo_findit')}</div>
      <div style="display:flex;gap:6px;justify-content:center">
        ${seq.map((ic,i)=>`<div class="combodot hit" style="${i<S.dailyCombo.prog?'':'opacity:.55'}">${ic}${i<S.dailyCombo.prog?'✓':''}</div>`).join('')}
      </div>
      <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        ${bank.map(ic=>`<button class="combodot" data-comboicon="${ic}" ${S.dailyCombo.claimed?'disabled':''}>${ic}</button>`).join('')}
      </div>
    </div>`;
}
function handleComboTap(icon){
  if(S.dailyCombo.claimed)return;
  const{seq}=dailySeq();
  if(icon===seq[S.dailyCombo.prog]){
    S.dailyCombo.prog++;sfx.combo();hap('light');
    if(S.dailyCombo.prog>=3){
      S.dailyCombo.claimed=true;

function isoWeek(d){d=new Date(d||Date.now());const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=(dt.getUTCDay()+6)%7;dt.setUTCDate(dt.getUTCDate()-day+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const week=1+Math.round(((dt-firstThu)/86400000-3+((firstThu.getUTCDay()+6)%7))/7);
  return dt.getUTCFullYear()+'-W'+week;}
function wkReset(){const base={week:isoWeek(),farm:0,win:0,boss:0,earn:0,egg:0,got:[]};
  if(!S.wk||S.wk.week!==isoWeek())S.wk=base;else S.wk=Object.assign({},base,S.wk);}

const COMBO_TIERS=[[100,8],[50,5],[25,3],[10,2],[0,1]];
function comboMult(n){for(const[th,m]of COMBO_TIERS)if(n>=th)return m;return 1;}

function hitBoss(times){const b=curBoss();if(S.lvl<b.lvl)return;const st=bossReset(b.id);if(st.dead)return;
  if(!spend(8*times))return;

  p.style.color=crits?'var(--gold)':'var(--pink)';

    const c=Math.round((700+S.lvl*260)*b.coinM),xp=Math.round((140+S.lvl*45)*b.xpM);

  paint();}

  const st=stats(),arenaMul=1+perkVal('arenadmg')/100;
  const tier=CFG.foes[clamp(Math.floor(S.lvl/5)+ri(0,1),0,CFG.foes.length-1)];
  const foe={n:tier.n,e:tier.e,tr:tier.tr,ty:tier.ty,atk:Math.round(st.atk*tier.p*(.9+Math.random()*.25)),
    def:Math.round(st.def*tier.p*.8),hp:Math.round(st.hp*tier.p*(.9+Math.random()*.2))};
  const comp=companion(),compDef=comp&&pelDef(comp),myTy=compDef?compDef.ty:null;
  const tAdv=typeMult(myTy,foe.ty);
  const foeMax=foe.hp;let myHp=st.hp,myStam=40,shieldUsed=false;
  $('foeFace').textContent=foe.e;$('foeName').textContent=foe.n.toUpperCase();
  const draw=()=>{$('myhp').style.width=clamp(myHp/st.hp*100,0,100)+'%';
    $('foehp').style.width=clamp(foe.hp/foeMax*100,0,100)+'%';
    $('myhptxt').textContent=Math.max(0,Math.round(myHp))+' HP';
    $('foehptxt').textContent=Math.max(0,Math.round(foe.hp))+' HP';};
  draw();drawStam(myStam);logLine(t('spar_in',foe.n),'#E85A9E');
  if(foe.tr)logLine(t('trait_'+foe.tr),'#1AA8B8');
  if(myTy&&tAdv!==1)logLine(t(tAdv>1?'adv_win':'adv_lose'),tAdv>1?'#28A860':'#E85A9E');
  await wait(500);
  let round=1;
  while(myHp>0&&foe.hp>0&&round<=20){
    setActs(myStam);
    const action=await new Promise(res=>{pendingAction=res;});
    $('aAtk').disabled=$('aPow').disabled=$('aDef').disabled=$('aUlt').disabled=true;
    let defending=false,riposteChance=0;
    if(action==='atk'){
      myStam=Math.min(100,myStam+18);
      const crit=Math.random()<(.05+st.luck*.012);
      let d=st.atk*arenaMul*tAdv*(.85+Math.random()*.3)*(1-foe.def/(foe.def+70))*(crit?2:1);
      d=Math.max(1,Math.round(d));
      if(foe.tr==='shield'&&!shieldUsed){d=Math.round(d*.3);shieldUsed=true;logLine(t('trait_shield'),'#3AA8D8');}
      foe.hp-=d;draw();logLine(t('spar_hit','<b>'+d+'</b>')+(crit?' 💥':''),'#28A860');hap('light');sfx.hit();
    }else if(action==='pow'){
      myStam=Math.max(0,myStam-40);
      if(Math.random()<.82){
        let d=st.atk*arenaMul*tAdv*1.75*(.85+Math.random()*.3)*(1-(foe.def*.75)/((foe.def*.75)+70));
        d=Math.max(1,Math.round(d));
        if(foe.tr==='shield'&&!shieldUsed){d=Math.round(d*.3);shieldUsed=true;logLine(t('trait_shield'),'#3AA8D8');}
        foe.hp-=d;draw();logLine(t('spar_hit','<b>💥'+d+'</b>'),'#E85A9E');hap('medium');
      }else{logLine('· · ·','#888');hap('light');}
    }else if(action==='def'){
      defending=true;myStam=Math.min(100,myStam+26);riposteChance=.3;logLine('🛡️','#3AA8D8');
    }else if(action==='ult'){
      myStam=0;let d=Math.round(st.atk*arenaMul*tAdv*2.6);
      if(foe.tr==='shield'&&!shieldUsed){shieldUsed=true;logLine(t('trait_shield'),'#3AA8D8');}
      foe.hp-=d;draw();logLine('<b>'+t('t_ultuse',d)+'</b>','#F2A007');hap('heavy');notif('success');
    }
    draw();drawStam(myStam);await wait(380);
    if(foe.hp<=0)break;
    const hpPct=foe.hp/foeMax,w=hpPct<.3?{pow:.45,def:.15}:{pow:.25,def:.2};
    const roll=Math.random();const facc=roll<w.pow?'pow':roll<w.pow+w.def?'def':'atk';
    const berserkMul=foe.tr==='berserk'?1+(1-hpPct)*.6:1;
    if(facc==='def'){
      logLine(t('t_foedef',foe.n),'#888');
    }else{
      let e=foe.atk*berserkMul*(facc==='pow'?1.6:1)*(.85+Math.random()*.3)*(1-st.def/(st.def+70));
      e=Math.max(1,Math.round(e));if(defending)e=Math.round(e*.35);
      myHp-=e;draw();
      logLine(t('spar_back',foe.n,'<b>'+e+'</b>')+(defending?' · '+t('t_block',e):''),'#E85A9E');
      if(foe.tr==='vamp'){const heal=Math.round(e*.3);foe.hp=Math.min(foeMax,foe.hp+heal);draw();logLine('🩸 +'+heal,'#E85A9E');}
      if(foe.tr==='swift'&&Math.random()<.35&&myHp>0){
        let e2=Math.round(foe.atk*berserkMul*.5*(.85+Math.random()*.3)*(1-st.def/(st.def+70)));
        if(defending)e2=Math.round(e2*.35);
        myHp-=e2;draw();logLine(t('spar_back',foe.n,'<b>'+e2+'</b>'),'#E85A9E');
      }
    }
    if(defending&&Math.random()<riposteChance&&foe.hp>0){
      const rd=Math.max(1,Math.round(st.atk*arenaMul*tAdv*.45));
      foe.hp-=rd;draw();logLine(t('t_riposte',rd),'#28A860');
    }
    draw();await wait(380);round++;}
  $('actrow').style.display='none';$('stamwrap').style.display='none';
  if(foe.hp<=0&&myHp>0){S.wins++;misReset();S.mis.win++;wkReset();S.wk.win++;
    const c=Math.round(280+S.lvl*90),pts=2,r=ri(8,16);
    S.rating+=r;gain(c,pts);addXp(30+S.lvl*10);
    logLine('<b>'+t('spar_win',fmt(c),pts,r)+'</b>','#F2A007');notif('success');confetti(16);sfx.victory();
    if(Math.random()<.22+perkVal('drop')/100){const it=makeItem(stats().luck);addItem(it);logLine(t('spar_drop',it.n),'#28A860');}
  }else{S.losses++;const r=ri(4,9);S.rating=Math.max(800,S.rating-r);
    const c=Math.round(60+S.lvl*12);gain(c,0);
    logLine(t('spar_lose',r,fmt(c)),'#E85A9E');notif('error');sfx.defeat();}
  sparring=false;$('spar').style.display='block';$('spar').disabled=false;$('spar').textContent=t('btn_find');paint();save();}
$('spar').onclick=spar;

let dexFilter='all';

      <div class="tier">${t(R.dk)}</div>
      <div class="pr">${active?t('peli_active'):t('btn_equipc')}</div></div>`;}).join('');
  renderTeam('teamRow');renderTeam('battleTeamRow');}
function peliModal(d){
  const owned=pelOwned(d.id),R=CFG.pelicanRarity[d.r],active=owned&&S.pelEq===owned.u,lv=owned?(owned.lv||0):0;
  const inTeam=owned&&(S.team||[]).includes(owned.u);
  const perkV=d.perk.v*(1+lv*.08);
  const lvCost=Math.round(260*(lv+1)*R.m),featherCost=(d.r+1)*(lv+1)*3;
  const canLv=owned&&lv<10&&S.coins>=lvCost&&S.res.feather>=featherCost;
  const buyCur=d.buy.cur==='pts'?S.pts:S.coins,canBuy=!owned&&buyCur>=d.buy.cost;
  let body=`<div style="display:grid;place-items:center;margin-bottom:2px">${vbirdSVG(d.r,d.ty,92)}</div>
    <h2 class="${R.t}">${d.n}</h2>
    <p class="muted" style="text-align:center"><span class="ty ty-${d.ty}">${CFG.typeIcon[d.ty]} ${t('ty_'+d.ty)}</span> · ${t(R.dk)}${owned?' · Lv '+lv:''}<br>
    +${pelStat({id:d.id,lv},'atk')} ${t('c_atk')} · +${pelStat({id:d.id,lv},'def')} ${t('c_def')} · +${pelStat({id:d.id,lv},'luck')} 🍀<br>
    ${t('perk_'+d.perk.t,Math.round(perkV))}</p>`;
  if(owned){
    body+=`<button class="btn green" id="pEq" style="margin-top:10px">${active?t('btn_unequipc'):t('btn_equipc')}</button>
      <button class="btn" id="pTeam" style="margin-top:8px;background:linear-gradient(155deg,var(--purple),var(--purple-dim));color:#fff">${inTeam?'★ '+t('h_team'):'☆ '+t('h_team')}</button>
      <button class="btn" id="pLv" ${canLv?'':'disabled'}>${lv>=10?t('maxlvl'):t('btn_lvup',lv+1,fmt(lvCost),featherCost)}</button>
      <button class="btn pale" onclick="closeModal()">${t('btn_close')}</button>`;
  }else{
    body+=`<button class="btn green" id="pBuy" ${canBuy?'':'disabled'} style="margin-top:10px">${t('btn_buy',d.buy.cur==='pts'?'💠 '+d.buy.cost:'🪙 '+fmt(d.buy.cost))}</button>
      <button class="btn pale" onclick="closeModal()">${t('btn_close')}</button>`;
  }
  openModal(body);
  if(owned){
    $('pEq').onclick=()=>{S.pelEq=active?null:owned.u;closeModal();hap('medium');paint();};
    $('pTeam').onclick=()=>{
      S.team=S.team||[];
      if(inTeam){S.team=S.team.filter(u=>u!==owned.u);}
      else{if(S.team.length>=3){toast(t('teamfull'));return;}S.team.push(owned.u);}
      closeModal();hap('medium');paint();};
    $('pLv').onclick=()=>{if(!canLv)return;S.coins-=lvCost;S.res.feather-=featherCost;owned.lv=(owned.lv||0)+1;
      misReset();S.mis.upg++;hap('heavy');closeModal();paint();};
  }else{
    $('pBuy').onclick=()=>{if(!canBuy)return;if(d.buy.cur==='pts')S.pts-=d.buy.cost;else S.coins-=d.buy.cost;
      S.peli.push({u:S.pelUid++,id:d.id,lv:0});confetti(d.r>=4?30:14);hap('medium');sfx.reward();toast(t('peli_new'));closeModal();paint();};
  }}
function rollEggTier(e){const tot=e.w.reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(let i=0;i<e.w.length;i++){if((x-=e.w[i])<=0)return e.tiers[i];}return e.tiers[e.tiers.length-1];}
function openEgg(id){
  const e=CFG.eggs.find(x=>x.id===id);if(!e)return;
  const cur=e.cur==='pts'?S.pts:S.coins;
  if(cur<e.cost){toast(t('t_notenough',e.cur==='pts'?t('cur_pts'):t('cur_coins')));return;}
  if(e.cur==='pts')S.pts-=e.cost;else S.coins-=e.cost;
  misReset();S.mis.egg++;wkReset();S.wk.egg++;S.stats.eggsOpened=(S.stats.eggsOpened||0)+1;
  S.pity[id]=(S.pity[id]||0)+1;
  let tier=rollEggTier(e);
  if(S.pity[id]>=e.pity&&tier<e.pityR)tier=e.pityR;
  if(tier>=e.pityR)S.pity[id]=0;
  let pool=CFG.pelicans.filter(p=>p.r===tier);
  if(!pool.length)pool=CFG.pelicans.filter(p=>p.r===e.tiers[0]);
  const d=pool[ri(0,pool.length-1)],owned=pelOwned(d.id),R=CFG.pelicanRarity[d.r];
  const isMythic=d.r>=6;
  hap('medium');sfx.hatch();
  if(owned){
    const hatchBonus=1+(S.hq.hatchery||0)*.05;
    const featherGain=Math.round(((d.r+1)*8+5)*hatchBonus);S.res.feather=(S.res.feather||0)+featherGain;
    notif('success');confetti(d.r>=4?20:10);
    openModal(`<h2 class="${R.t}">${d.n}</h2><div class="rays"><div class="em">${vbirdSVG(d.r,d.ty,80)}</div></div>
      <p class="muted" style="text-align:center"><b class="${R.t}">${t(R.dk)}</b><br>${t('peli_dup',featherGain)}</p>
      <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_close')}</button>`);
  }else{
    S.peli.push({u:S.pelUid++,id:d.id,lv:0});
    notif('success');confetti(d.r>=4?34:16);if(isMythic)sfx.legendary();else sfx.reward();
    openModal(`<h2 class="${R.t}">${isMythic?t('mythic_pull'):d.n}</h2><div class="rays"><div class="em">${vbirdSVG(d.r,d.ty,80)}</div></div>
      <p class="muted" style="text-align:center">${isMythic?'<b>'+d.n+'</b><br>':''}<b class="${R.t}">${t(R.dk)}</b><br><b style="color:var(--palm-dark)">${t('peli_new')}</b></p>
      <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_close')}</button>`);
  }
  paint();save();}

/* ══════════ 11. clicks ══════════ */
document.addEventListener('click',e=>{const el=e.target;
  const mis=el.closest('[data-mis]');
  if(mis){const m=CFG.missions.find(x=>x.id===mis.dataset.mis);
    if(m&&!S.mis.got.includes(m.id)&&S.mis[m.key]>=m.goal){S.mis.got.push(m.id);gain(m.c,m.p);hap('medium');confetti(12);toast(t('t_mission'));paint();}return;}
  const ach=el.closest('[data-ach]');
  if(ach){const a=CFG.achs.find(x=>x.id===ach.dataset.ach);
    if(a&&a.f(S)&&!S.ach.includes(a.id)){S.ach.push(a.id);gain(a.c,a.p);notif('success');confetti(18);toast(t('t_ach',a.n));paint();}return;}
  const hq=el.closest('[data-hq]');
  if(hq){const b=CFG.hq.find(x=>x.id===hq.dataset.hq),l=S.hq[b.id]||0;
    const cost=Math.round(b.cost*Math.pow(b.m,l)),need=Object.entries(b.res).map(([k,v])=>[k,Math.round(v*Math.pow(1.5,l))]);
    if(S.coins<cost||!need.every(([k,v])=>S.res[k]>=v))return;
    S.coins-=cost;need.forEach(([k,v])=>S.res[k]-=v);S.hq[b.id]=l+1;hap('medium');paint();return;}
  const up=el.closest('[data-up]');
  if(up){const u=CFG.ups.find(x=>x.id===up.dataset.up),c=upCost(u);
    if(S.coins<c)return;S.coins-=c;S.up[u.id]++;if(u.id==='cap')S.en+=10;hap('medium');paint();return;}
  const loc=el.closest('[data-loc]');
  if(loc){const l=CFG.locations.find(x=>x.id===loc.dataset.loc);
    if(S.run||S.lvl<l.lvl||!spend(l.en))return;
    S.run={id:l.id,end:Date.now()+l.sec*1000};hap('medium');paint();return;}
  const it=el.closest('[data-it]');
  if(it){const i=S.inv.find(x=>x.u===+it.dataset.it);if(i)itemModal(i);return;}
  const bo=el.closest('[data-bo]');
  if(bo){const b=CFG.boosters.find(x=>x.id===bo.dataset.bo);
    const cur=b.cur==='pts'?S.pts:S.coins;if(cur<b.cost)return;
    if(b.cur==='pts')S.pts-=b.cost;else S.coins-=b.cost;
    if(b.id==='ref'){S.en=enMax();toast(t('t_refilled'));}
    else{S.buff[b.id]=Math.max(Date.now(),S.buff[b.id]||0)+b.mins*60000;toast(t('t_boostact',b.n));}
    misReset();S.mis.boost++;hap('medium');paint();return;}
  const sk=el.closest('[data-sk]');
  if(sk){const s=CFG.skins.find(x=>x.id===sk.dataset.sk);
    if(!S.own.includes(s.id)){const cur=s.cur==='pts'?S.pts:S.coins;
      if(cur<s.cost){toast(t('t_notenough',s.cur==='pts'?t('cur_pts'):t('cur_coins')));return;}
      if(s.cur==='pts')S.pts-=s.cost;else S.coins-=s.cost;
      S.own.push(s.id);confetti(14);toast(t('t_unlocked',s.n));}
    S.skin[s.s]=S.skin[s.s]===s.id?null:s.id;hap('medium');drawPel();paint();return;}
  const bch=el.closest('[data-boss]');
  if(bch){const b=CFG.bosses.find(x=>x.id===bch.dataset.boss);
    if(!b||S.lvl<b.lvl){if(b)toast(t('loc_lock',b.lvl));return;}
    S.bossSel=b.id;hap();paint();return;}
  const pk=el.closest('[data-pel]');
  if(pk){const d=CFG.pelicans.find(x=>x.id===pk.dataset.pel);if(d)peliModal(d);return;}
  const eg=el.closest('[data-egg]');
  if(eg){openEgg(eg.dataset.egg);return;}
  const lg=el.closest('[data-lg]');
  if(lg){setLang(lg.dataset.lg);hap('medium');paint();return;}
  const wk=el.closest('[data-wk]');
  if(wk){const w=CFG.weekly.find(x=>x.id===wk.dataset.wk);
    if(w&&!S.wk.got.includes(w.id)&&S.wk[w.key]>=w.goal){S.wk.got.push(w.id);gain(w.c,w.p);hap('medium');notif('success');confetti(16);sfx.reward();toast(t('t_mission'));paint();}return;}
  const cbi=el.closest('[data-comboicon]');
  if(cbi&&!cbi.disabled){handleComboTap(cbi.dataset.comboicon);return;}
  const rf=el.closest('[data-rarf]');
  if(rf){dexFilter=rf.dataset.rarf;hap();renderPeliShop();return;}
  const trm=el.closest('[data-teamrem]');
  if(trm){S.team=(S.team||[]).filter(u=>u!==+trm.dataset.teamrem);hap();paint();return;}
  const tpk=el.closest('[data-titlepick]');
  if(tpk){const ti=CFG.titles.find(x=>x.id===tpk.dataset.titlepick);
    if(ti&&ti.f(S)){S.title=ti.id;hap('medium');paint();}return;}});

function openSheet(id){$(id+'Mask').classList.add('on');hap();}
function closeSheet(id){$(id+'Mask').classList.remove('on');}
$('openBag').onclick=()=>{openSheet('bag');renderBag();};
$('bagClose').onclick=()=>closeSheet('bag');
$('bagMask').addEventListener('click',e=>{if(e.target===$('bagMask'))closeSheet('bag');});
$('openShop').onclick=()=>{openSheet('shop');renderShop();};
$('shopClose').onclick=()=>closeSheet('shop');
$('shopMask').addEventListener('click',e=>{if(e.target===$('shopMask'))closeSheet('shop');});
$('collectNest2').onclick=()=>$('collectNest').click();

$('invite').onclick=()=>{const id=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)?TG.initDataUnsafe.user.id:'demo';
  const link='https://t.me/pepel1kan?start=ref'+id,txt='Join the PEPELIKAN flock 🐦 We fly higher.';
  try{if(TG&&TG.openTelegramLink){TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(txt));return;}}catch(e){}
  openModal(`<h2>${t('your_link')}</h2><p class="muted" style="text-align:center;word-break:break-all">${link}</p>
    <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_close')}</button>`);};

function renderProfile(){
  const curT=CFG.titles.find(x=>x.id===S.title)||CFG.titles[0];
  $('profileTitle').innerHTML=`<b style="color:var(--purple-dim);font-family:'Fredoka';font-weight:600;font-size:13px">${t(curT.dk)}</b> · LV ${S.lvl}`;
  $('titlePick').innerHTML=CFG.titles.map(ti=>{const ok=ti.f(S);
    return `<div class="tpk ${S.title===ti.id?'on':''} ${ok?'':'locked'}" ${ok?'data-titlepick="'+ti.id+'"':''}>${ok?'':'🔒 '}${t(ti.dk)}</div>`;}).join('');
  const days=S.stats.days||1;
  $('statGrid').innerHTML=`
    <div class="stg"><b>${fmt(S.stats.taps||0)}</b><span>${t('st_taps')}</span></div>
    <div class="stg"><b>${S.wins}</b><span>${t('st_wins')}</span></div>
    <div class="stg"><b>${S.losses}</b><span>${t('st_loss')}</span></div>
    <div class="stg"><b>${S.kills}</b><span>${t('st_kills')}</span></div>
    <div class="stg"><b>${S.stats.eggsOpened||0}</b><span>${t('st_eggs')}</span></div>
    <div class="stg"><b>${S.farms}</b><span>${t('st_runs')}</span></div>
    <div class="stg"><b>${S.peli.length}</b><span>${t('st_pels')}</span></div>
    <div class="stg"><b>${days}</b><span>${t('st_days')}</span></div>`;
  $('toggleSound').textContent=S.settings.sound?t('sound_on'):t('sound_off');
  $('toggleSound').className='mini '+(S.settings.sound?'g':'');
  $('toggleHaptic').textContent=S.settings.haptics?t('haptic_on'):t('haptic_off');
  $('toggleHaptic').className='mini '+(S.settings.haptics?'g':'');
  $('langGrid').innerHTML=LANGS.map(l=>`<div class="lg ${l.c===LANGS[LI].c?'on':''}" data-lg="${l.c}"><span>${l.f}</span>${l.n}</div>`).join('');
  $('profileStatsLine').textContent=t('set_stats',S.rating,S.wins,S.losses,S.farms,S.kills)+' · '+t('set_saved');
}
$('toggleSound').onclick=()=>{S.settings.sound=!S.settings.sound;hap('medium');if(S.settings.sound)sfx.tap();paint();};
$('toggleHaptic').onclick=()=>{S.settings.haptics=!S.settings.haptics;paint();hap('medium');};
$('rs').onclick=()=>{openModal(`<h2>${t('set_ask')}</h2>
    <p class="muted" style="text-align:center">${t('set_warn')}</p>
    <button class="btn pink" id="yes" style="margin-top:12px">${t('set_yes')}</button>
    <button class="btn pale" onclick="closeModal()">${t('set_keep')}</button>`);
  $('yes').onclick=()=>{const lang=S.lang;S=fresh();S.lang=lang;save();closeModal();drawPel();paint();toast(t('t_fresh'));};};

/* ══════════ 12. paint ══════════ */
function paintTop(){const st=stats();
  $('b-coins').textContent=fmt(S.coins);$('b-pts').textContent=fmt(S.pts);
  $('b-atk').textContent=st.atk;$('b-def').textContent=st.def;
  $('lvl').textContent='LV '+S.lvl;
  $('xpfill').style.width=clamp(S.xp/needXp(S.lvl)*100,0,100)+'%';
  $('xptxt').textContent=fmt(S.xp)+'/'+fmt(needXp(S.lvl));
  const act=CFG.boosters.filter(b=>buffOn(b.id));
  $('buffs').innerHTML=act.map(b=>`<span class="buff">${b.i} ${b.n} · ${Math.ceil((S.buff[b.id]-Date.now())/60000)}m</span>`).join('');}
function paintEnergy(){regen();const m=enMax();
  $('enfill').style.width=clamp(S.en/m*100,0,100)+'%';
  $('entxt').textContent=Math.floor(S.en)+'/'+m;
  $('enhint').textContent=S.en>=m?t('en_full'):t('en_rate',regRate().toFixed(1),Math.ceil((m-S.en)/regRate()));}
function paintRun(){const c=$('runcard');
  if(!S.run){c.style.display='none';document.querySelector('nav button[data-go="world"]').classList.remove('dot');return;}
  const l=CFG.locations.find(x=>x.id===S.run.id),left=Math.max(0,S.run.end-Date.now());
  c.style.display='block';$('runname').textContent=l.i+' '+l.n;
  $('runbar').style.width=(100-left/(l.sec*1000)*100)+'%';
  $('runsub').textContent=t('run_exp',fmt(l.coin[0])+'–'+fmt(l.coin[1]),Math.round(l.drop*100));
  const b=$('collect');b.disabled=left>0;
  b.textContent=left>0?t('run_back',Math.ceil(left/1000)):t('run_collect');
  document.querySelector('nav button[data-go="world"]').classList.toggle('dot',left<=0);}
function paint(){paintTop();paintEnergy();paintRun();
  renderMis();renderWeekly();renderDailyCombo();renderAch();renderHQ();renderUp();renderLocs();renderBag();renderBoss();renderShop();renderPeliShop();renderProfile();
  $('arenarec').textContent=t('rating',S.rating,S.wins,S.losses);
  $('spar').textContent=t('btn_find');
  $('meName').textContent=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.first_name)?TG.initDataUnsafe.user.first_name.toUpperCase():t('you');
  $('res').innerHTML=CFG.resList.map(([k,e])=>`<div><span>${e}</span><b>${fmt(S.res[k])}</b></div>`).join('');
  if(S.tap.date!==today())S.tap={date:today(),n:0};
  $('tapmeter').textContent=t('taps',S.tap.n,CFG.tapCap);
  save();}

/* ══════════ 13. boot ══════════ */
function runTutorial(after){
  if(S.tutDone){after&&after();return;}
  const steps=[
    {h:t('tut_1'),b:t('tut_1b'),em:'👋'},
    {h:t('tut_2'),b:'',em:'🔥'},
    {h:t('tut_3'),b:'',em:'🗺️'}
  ];
  let i=0;
  const showStep=()=>{const s=steps[i];
    openModal(`<h2>${s.h}</h2><div class="rays"><div class="em">${s.em}</div></div>
      ${s.b?'<p class="muted" style="text-align:center">'+s.b+'</p>':''}
      <button class="btn green" id="tutNext" style="margin-top:12px">${i<steps.length-1?t('btn_flyon'):t('tut_go')}</button>`);
    $('tutNext').onclick=()=>{i++;if(i<steps.length)showStep();else{S.tutDone=true;closeModal();save();after&&setTimeout(after,300);}};};
  showStep();
}
load(()=>{
  const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
  if(!S.lang){const c=(u&&u.language_code||navigator.language||'en').slice(0,2);
    S.lang=LANGS.some(x=>x.c===c)?c:'en';}
  LI=Math.max(0,LANGS.findIndex(x=>x.c===S.lang));
  if(u)$('nick').textContent=(u.first_name||u.username||'PELICAN').toUpperCase();
  applyStatic();regen();bossReset();misReset();wkReset();
  if(S.run&&Date.now()>S.run.end+864e5)S.run=null;
  const lastDate=S.stats.lastSeen?new Date(S.stats.lastSeen).toISOString().slice(0,10):null;
  if(lastDate!==today()){S.stats.days=(S.stats.days||0)+1;}
  S.stats.lastSeen=Date.now();if(!S.stats.firstSeen)S.stats.firstSeen=Date.now();
  drawPel();paint();
  const{h,out}=hqPending();
  setTimeout(()=>{$('splash').classList.add('gone');
    if(h>.25&&Object.values(out).some(v=>v>=1)){
      openModal(`<h2>${t('wc_title')}</h2><div class="rays"><div class="em">🏚️</div></div>
        <p class="muted" style="text-align:center">${t('off_note',h.toFixed(1))}<br>
        ${hqSummary(out)}</p>
        <button class="btn green" id="cn" style="margin-top:12px">${t('hq_collect')}</button>`);
      $('cn').onclick=()=>{$('collectNest').click();closeModal();setTimeout(()=>runTutorial(checkDaily),300);};
    }else setTimeout(()=>runTutorial(checkDaily),400);},1500);
  setInterval(()=>{paintTop();paintEnergy();paintRun();if($('s-home').classList.contains('on'))renderHQ();},1000);
});
</script>
