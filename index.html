<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08170F">
<title>PEPELIKAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-1:#0A1F16; --bg-2:#05130D; --murk:#123024; --murk-2:#1B4433;
  --panel:#10281E; --panel-2:#16352728; --line:#2C6B4E;
  --neon:#7CFF3D; --neon-dim:#4FBF22; --pink:#FF2E97; --cyan:#29E5D0;
  --gold:#FFC53D; --gold-dark:#E88C00;
  --pepe:#62B23A; --pepe-lit:#8FD95E; --pepe-dark:#33701F;
  --beak:#FFA51F; --beak-lit:#FFC94A;
  --ink:#04100B; --txt:#EAFBE4;
  --r:18px; --bd:3px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;font-weight:800;color:var(--txt);background:var(--bg-2);
  user-select:none;-webkit-user-select:none}
.dsp{font-family:'Bungee',cursive;font-weight:400;letter-spacing:.5px}

/* ═══ living swamp ═══ */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
.fly{animation:soar 24s linear infinite;opacity:.5}
@keyframes soar{from{transform:translate(-70px,30px)}to{transform:translate(480px,-30px)}}
.wave{animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}
.fire{animation:blip 3s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.15;transform:translateY(0)}50%{opacity:.9;transform:translateY(-16px)}}
#moon{animation:glow 7s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:.55}}
.sign{animation:flicker 5s steps(1) infinite}
@keyframes flicker{0%,88%,92%,100%{opacity:1}90%,94%{opacity:.25}}

/* ═══ shell ═══ */
#app{position:relative;z-index:2;display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 12px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.on{display:block;animation:slide .22s cubic-bezier(.2,.9,.3,1)}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ hud ═══ */
.hud{flex:0 0 auto;padding:calc(6px + env(safe-area-inset-top)) 12px 4px}
.idrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.ava{width:42px;height:42px;flex:0 0 auto;border-radius:13px;border:var(--bd) solid var(--ink);
  background:linear-gradient(160deg,var(--pepe-lit),var(--pepe-dark));box-shadow:0 3px 0 var(--ink);
  display:grid;place-items:center;font-size:22px}
.who{flex:1;min-width:0}
.nick{font-size:15px;line-height:1;color:#fff;text-shadow:0 0 12px var(--neon),0 2px 0 var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpwrap{display:flex;align-items:center;gap:5px;margin-top:5px}
.xpbar{flex:1;height:10px;border:2px solid var(--ink);border-radius:6px;background:#00000060;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon),var(--cyan));
  box-shadow:0 0 10px var(--neon);transition:width .4s}
.xptxt{font-size:9px;opacity:.75}
.lvl{font-size:12px;background:linear-gradient(var(--gold),var(--gold-dark));border:var(--bd) solid var(--ink);
  border-radius:11px;padding:5px 9px;box-shadow:0 3px 0 var(--ink);color:#2B1600}
.gear{width:38px;height:38px;flex:0 0 auto;border-radius:12px;border:var(--bd) solid var(--ink);
  background:var(--panel);box-shadow:0 3px 0 var(--ink);font-size:17px;display:grid;place-items:center;cursor:pointer}
.gear:active{transform:translateY(3px);box-shadow:0 0 0}
.bals{display:flex;gap:6px}
.bal{flex:1;min-width:0;background:var(--panel);border:var(--bd) solid var(--ink);border-radius:13px;
  box-shadow:0 3px 0 var(--ink);padding:4px 3px;text-align:center;position:relative;overflow:hidden}
.bal b{display:block;font-family:'Bungee';font-weight:400;font-size:13px;line-height:1.25;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal span{font-size:8px;opacity:.6;letter-spacing:.6px;text-transform:uppercase}
.bal.flash::after{content:'';position:absolute;inset:0;background:var(--neon);opacity:.45;animation:fade .6s ease-out forwards}
@keyframes fade{to{opacity:0}}
.buffs{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.buff{font-size:10px;background:linear-gradient(var(--pink),#B10E60);color:#fff;border:2px solid var(--ink);
  border-radius:9px;padding:2px 7px;box-shadow:0 2px 0 var(--ink)}

/* ═══ cards ═══ */
.card{background:linear-gradient(180deg,#16382A,#0D2419);border:var(--bd) solid var(--ink);border-radius:var(--r);
  box-shadow:0 5px 0 var(--ink),inset 0 1px 0 #ffffff18;padding:12px;margin-bottom:11px;position:relative}
.card h3{font-family:'Bungee';font-weight:400;font-size:12.5px;margin:0 0 9px;letter-spacing:.8px;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;color:var(--neon);text-shadow:0 0 10px #7cff3d55}
.card h3 em{font-style:normal;margin-left:auto;font-size:10.5px;opacity:.55;font-family:'Nunito';color:var(--txt)}
.muted{font-size:12px;font-weight:700;opacity:.7;line-height:1.5}

.btn{font-family:'Bungee';font-weight:400;font-size:14px;letter-spacing:.5px;
  background:linear-gradient(var(--gold),var(--gold-dark));border:var(--bd) solid var(--ink);border-radius:15px;
  box-shadow:0 5px 0 var(--ink);padding:12px 14px;cursor:pointer;width:100%;color:#2B1600;
  transition:transform .07s,box-shadow .07s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn.green{background:linear-gradient(var(--neon),var(--neon-dim));color:#06210A}
.btn.pink{background:linear-gradient(var(--pink),#A50F63);color:#fff}
.btn.pale{background:linear-gradient(#2A5C44,#1A4030);color:var(--txt)}
.btn:disabled{filter:grayscale(.75);opacity:.5;cursor:default}
.btn+.btn{margin-top:8px}

/* ═══ stage ═══ */
.stage{position:relative;height:252px;display:grid;place-items:center}
#pel{width:250px;height:auto;overflow:visible;cursor:pointer;image-rendering:pixelated;
  filter:drop-shadow(0 0 18px #7cff3d3a)}
#bird{transform-origin:20px 36px;animation:bob 2.6s steps(1) infinite}
#shadow{transform-origin:20px 37px;animation:shd 2.6s steps(1) infinite}
@keyframes shd{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
#bird.hit{animation:squash .2s steps(1)}
@keyframes squash{0%{transform:none}50%{transform:scaleY(.92) translateY(1px)}100%{transform:none}}
.pop{position:absolute;font-family:'Bungee';font-size:20px;color:var(--neon);z-index:5;
  text-shadow:0 0 12px var(--neon),0 2px 0 var(--ink);pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}
  25%{transform:translate(calc(var(--dx)*.4),-34px) scale(1.25)}
  100%{opacity:0;transform:translate(var(--dx),-96px) scale(1)}}
.fishjump{position:absolute;font-size:26px;pointer-events:none;animation:jump 1.1s ease-out forwards;z-index:5}
@keyframes jump{0%{opacity:0;transform:translateY(10px)}30%{opacity:1}100%{opacity:0;transform:translateY(-84px) rotate(340deg)}}
.tapmeter{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10.5px;opacity:.6}
.slog{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:'Bungee';font-size:11px;
  color:var(--pink);text-shadow:0 0 14px var(--pink);letter-spacing:2px;opacity:.9}

/* ═══ bars ═══ */
.enwrap{display:flex;align-items:center;gap:9px}
.enbar{flex:1;height:18px;border:var(--bd) solid var(--ink);border-radius:10px;background:#00000055;overflow:hidden}
.enbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--beak));
  box-shadow:0 0 12px var(--gold);transition:width .3s}
.entxt{font-family:'Bungee';font-size:12.5px;white-space:nowrap}
.prog{height:9px;border:2px solid var(--ink);border-radius:6px;background:#00000055;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width .3s}

/* ═══ rows ═══ */
.row{display:flex;align-items:center;gap:10px;padding:8px;border:var(--bd) solid var(--ink);border-radius:15px;
  background:#0B2118;margin-bottom:8px;position:relative;overflow:hidden}
.row:last-child{margin-bottom:0}
.row.locked{opacity:.4;filter:grayscale(.7)}
.row .ic{width:44px;height:44px;flex:0 0 auto;border-radius:13px;border:var(--bd) solid var(--ink);
  display:grid;place-items:center;font-size:21px}
.row .mid{flex:1;min-width:0}
.row .ttl{font-family:'Bungee';font-weight:400;font-size:12.5px;letter-spacing:.3px}
.row .sub{font-size:11px;font-weight:700;opacity:.72;margin-top:3px;line-height:1.4}
.mini{font-family:'Bungee';font-weight:400;font-size:11px;padding:10px 11px;border:var(--bd) solid var(--ink);
  border-radius:13px;background:linear-gradient(var(--gold),var(--gold-dark));box-shadow:0 3px 0 var(--ink);
  cursor:pointer;white-space:nowrap;color:#2B1600;flex:0 0 auto}
.mini:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0}
.mini:disabled{filter:grayscale(.75);opacity:.45}
.mini.g{background:linear-gradient(var(--neon),var(--neon-dim));color:#06210A}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.res div{background:#0B2118;border:var(--bd) solid var(--ink);border-radius:12px;padding:5px 2px;text-align:center}
.res span{display:block;font-size:17px;line-height:1.25}
.res b{font-size:10.5px;font-family:'Bungee';font-weight:400}

/* ═══ inventory ═══ */
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.it{aspect-ratio:1;border:var(--bd) solid var(--ink);border-radius:14px;position:relative;
  display:grid;place-items:center;font-size:21px;cursor:pointer;overflow:hidden}
.it.eq::before{content:'';position:absolute;inset:0;box-shadow:0 0 0 3px var(--neon) inset;border-radius:11px}
.it .lv{position:absolute;bottom:1px;right:4px;font-size:9px;font-family:'Bungee'}
.it .st{position:absolute;top:1px;left:4px;font-size:9px;font-family:'Bungee';opacity:.75}
.shine::after{content:'';position:absolute;top:-60%;left:-60%;width:40%;height:220%;
  background:linear-gradient(90deg,#fff0,#ffffffc0,#fff0);transform:rotate(24deg);animation:sheen 2.8s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}
.slot{border:var(--bd) dashed var(--line);border-radius:14px;background:#0B2118;padding:8px 4px;text-align:center;min-width:0}
.slot b{display:block;font-size:8.5px;text-transform:uppercase;opacity:.5;letter-spacing:.6px}
.slot em{display:block;font-family:'Bungee';font-style:normal;font-size:10.5px;margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot i{font-style:normal;font-size:10px;opacity:.6}
.r0{background:#3A3A3A}.r1{background:#2C5E1C}.r2{background:#144C77}
.r3{background:#4A1E86}.r4{background:#8A5A06}.r5{background:#8C0B49}.r6{background:linear-gradient(135deg,#FF2E97,#29E5D0,#FFC53D);background-size:300% 300%;animation:unusual 3s ease infinite}
.rt0{color:#C9C9C9}.rt1{color:#9BE86B}.rt2{color:#6CC8FF}
.rt3{color:#C79BFF}.rt4{color:#FFC53D}.rt5{color:#FF6BB5}.rt6{background:linear-gradient(90deg,#FF2E97,#FFC53D,#29E5D0,#FF2E97);background-size:300% auto;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:unusual 2.4s linear infinite}
@keyframes unusual{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ═══ pelicans & bosses ═══ */
.bossrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px;margin-bottom:9px;-webkit-overflow-scrolling:touch}
.bossrow::-webkit-scrollbar{display:none}
.bch{flex:0 0 auto;width:58px;text-align:center;padding:7px 3px 6px;border:var(--bd) solid var(--ink);border-radius:15px;
  background:#0B2118;cursor:pointer;position:relative}
.bch.on{background:linear-gradient(#2C6B2A,#17421A);box-shadow:0 0 0 2px var(--neon) inset}
.bch.locked{opacity:.4;filter:grayscale(.7)}
.bch .em{font-size:24px;line-height:1.2}
.bch .nm{font-size:8px;font-family:'Bungee';margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bch .dn{position:absolute;top:3px;right:5px;font-size:10px}
.stamwrap{margin:9px 0 2px}
.stamlabel{font-size:9px;opacity:.6;letter-spacing:.6px;margin-bottom:3px;font-family:'Bungee'}
.stambar{height:13px;border:2px solid var(--ink);border-radius:8px;background:#00000055;overflow:hidden}
.stambar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#1B9E90);box-shadow:0 0 8px var(--cyan);transition:width .3s}
.stambar i.full{background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 0 10px var(--gold)}
.actrow{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}
.actrow button{font-family:'Bungee';font-weight:400;font-size:10.5px;padding:10px 4px;border:var(--bd) solid var(--ink);
  border-radius:13px;background:var(--panel);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--txt)}
.actrow button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0}
.actrow button:disabled{filter:grayscale(.8);opacity:.4}
.actrow button.a-atk{background:linear-gradient(var(--neon),var(--neon-dim));color:#06210A}
.actrow button.a-pow{background:linear-gradient(var(--pink),#A50F63);color:#fff}
.actrow button.a-def{background:linear-gradient(#2E6FB0,#144C77);color:#fff}
.actrow button.a-ult{background:linear-gradient(var(--gold),var(--gold-dark));color:#2B1600}
.trait{display:inline-block;font-size:9.5px;background:#0000004a;border:1px solid var(--line);border-radius:8px;padding:2px 6px;margin-left:4px}
.pk{border:var(--bd) solid var(--ink);border-radius:16px;background:#0B2118;padding:9px 7px;text-align:center;cursor:pointer;position:relative}
.pk.on{background:linear-gradient(#2C6B2A,#17421A);box-shadow:0 0 0 2px var(--neon) inset}
.pk.locked{opacity:.55}
.pk .em{font-size:30px;line-height:1.2}
.pk .nm{font-family:'Bungee';font-size:9.5px;margin:4px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .tier{font-size:8.5px;opacity:.75;text-transform:uppercase;letter-spacing:.4px}
.pk .pr{font-size:9.5px;opacity:.7;margin-top:2px}
.pk .own{position:absolute;top:5px;right:7px;font-size:11px}
.pk .lv{position:absolute;top:5px;left:7px;font-size:9px;font-family:'Bungee';opacity:.8}
.eggrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.egg{border:var(--bd) solid var(--ink);border-radius:16px;background:linear-gradient(180deg,#16382A,#0D2419);padding:12px 8px;text-align:center;cursor:pointer}
.egg .em{font-size:38px}
.egg .nm{font-family:'Bungee';font-size:11px;margin:5px 0 2px}
.egg .pr{font-size:10.5px;opacity:.75}
.egg .pity{font-size:8.5px;opacity:.55;margin-top:3px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

/* ═══ tabs ═══ */
.tabs{display:flex;gap:7px;margin-bottom:11px}
.tabs button{flex:1;font-family:'Bungee';font-weight:400;font-size:11px;padding:10px 4px;border:var(--bd) solid var(--ink);
  border-radius:14px;background:var(--panel);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--txt)}
.tabs button.on{background:linear-gradient(var(--neon),var(--neon-dim));color:#06210A}
.tabs button:active{transform:translateY(4px);box-shadow:0 0 0}
.pane{display:none}.pane.on{display:block}

/* ═══ combat ═══ */
.bosswrap{position:relative;height:140px;display:grid;place-items:center;margin-bottom:8px}
.bossface{font-size:82px;filter:drop-shadow(0 0 20px #ff2e9755)}
.bossface.shake{animation:shk .32s}
@keyframes shk{0%,100%{transform:none}25%{transform:translate(-9px,3px) rotate(-6deg)}75%{transform:translate(9px,-3px) rotate(6deg)}}
.hpbar{height:24px;border:var(--bd) solid var(--ink);border-radius:12px;background:#00000060;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(var(--pink),#8E0B4E);box-shadow:0 0 12px #ff2e9788;transition:width .4s}
.hpbar.mine i{background:linear-gradient(var(--neon),var(--neon-dim));box-shadow:0 0 12px #7cff3d88}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bungee';font-size:11.5px;
  color:#fff;text-shadow:0 1px 3px #000}
.phase{display:flex;gap:4px;margin-top:6px}
.phase i{flex:1;height:5px;border-radius:3px;background:#ffffff1a}
.phase i.on{background:var(--pink);box-shadow:0 0 8px var(--pink)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:10px}
.fighter{text-align:center;min-width:0}
.fighter .face{font-size:40px}
.fighter .nm{font-family:'Bungee';font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs{font-family:'Bungee';font-size:17px;color:var(--pink)}
.log{background:#00000055;border:var(--bd) solid var(--ink);border-radius:14px;padding:8px 10px;
  font-size:11.5px;height:120px;overflow-y:auto;line-height:1.65}
.log div{animation:logIn .25s ease-out}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

/* ═══ shop ═══ */
.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sk{border:var(--bd) solid var(--ink);border-radius:16px;background:#0B2118;padding:9px 7px;text-align:center;
  cursor:pointer;position:relative}
.sk.on{background:linear-gradient(#2C6B2A,#17421A);box-shadow:0 0 0 2px var(--neon) inset}
.sk .em{font-size:29px;line-height:1.25}
.sk .nm{font-family:'Bungee';font-size:10px;margin:4px 0 2px}
.sk .pr{font-size:10.5px;opacity:.7}
.sk .own{position:absolute;top:5px;right:7px;font-size:11px}

/* ═══ nav ═══ */
nav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  padding:7px 10px calc(9px + env(safe-area-inset-bottom))}
nav button{position:relative;font-family:'Bungee';font-weight:400;font-size:8.5px;letter-spacing:.2px;
  background:var(--panel);border:var(--bd) solid var(--ink);border-radius:15px;box-shadow:0 4px 0 var(--ink);
  padding:6px 1px;cursor:pointer;color:var(--txt);transition:transform .1s}
nav button span{display:block;font-size:19px;line-height:1.25}
nav button.on{background:linear-gradient(var(--neon),var(--neon-dim));color:#06210A;transform:translateY(-3px)}
nav button:active{transform:translateY(4px);box-shadow:0 0 0}
nav button i{position:absolute;top:4px;right:8px;width:9px;height:9px;background:var(--pink);
  border:2px solid var(--ink);border-radius:50%;display:none}
nav button.dot i{display:block}

/* ═══ modal ═══ */
.mask{position:fixed;inset:0;background:#04100BE0;display:none;place-items:center;padding:18px;z-index:50;backdrop-filter:blur(4px)}
.mask.on{display:grid}
.modal{background:linear-gradient(180deg,#1A4030,#0C2318);border:4px solid var(--ink);border-radius:22px;
  box-shadow:0 7px 0 var(--ink),0 0 40px #7cff3d22;padding:16px;width:100%;max-width:360px;max-height:88dvh;
  overflow-y:auto;animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-family:'Bungee';font-weight:400;font-size:18px;margin:0 0 6px;text-align:center;
  color:var(--neon);text-shadow:0 0 14px #7cff3d66}
.rays{position:relative;height:96px;display:grid;place-items:center;margin:4px 0}
.rays::before{content:'';position:absolute;width:190px;height:190px;
  background:conic-gradient(from 0deg,#7CFF3D 0 10deg,#fff0 10deg 30deg);border-radius:50%;
  animation:spin 9s linear infinite;opacity:.28}

function rectsFrom(rows,oy){
  let out='';
  rows.forEach((row,ry)=>{
    let x=0;
    while(x<row.length){
      const ch=row[x];
      if(ch==='.'){ x++; continue; }
      let w=1; while(row[x+w]===ch) w++;
      out+=`<rect x="${x}" y="${oy+ry}" width="${w}" height="1" fill="${PAL[ch]||'#f0f'}"/>`;
      x+=w;
    }
  });
  return out;
}

function migrate(){
  CFG.hq.forEach(b=>{ if(S.hq[b.id]===undefined) S.hq[b.id]=0; });
  CFG.resList.forEach(([k])=>{ if(S.res[k]===undefined) S.res[k]=0; });
  if(!S.boss||S.boss.date!==undefined){ const old=(S.boss&&S.boss.date!==undefined)?S.boss:null; S.boss={};
    if(old) S.boss[S.bossSel||CFG.bosses[0].id]=old; }
  if(!S.bossSel||!CFG.bosses.some(b=>b.id===S.bossSel)) S.bossSel=CFG.bosses[0].id;
  if(!Array.isArray(S.bossSeen)) S.bossSeen=[];
  if(!Array.isArray(S.peli)) S.peli=[];
  if(S.pelUid===undefined) S.pelUid=1;
  if(S.pelEq===undefined) S.pelEq=null;
  if(!S.pity) S.pity={common:0,golden:0};
  if(S.pity.common===undefined) S.pity.common=0;
  if(S.pity.golden===undefined) S.pity.golden=0;
  S.v=4;
}
function load(cb){const apply=raw=>{if(raw){try{const p=JSON.parse(raw);if(p&&p.v>=3)S=Object.assign(fresh(),p);}catch(e){}}migrate();cb();};
  try{if(TG&&TG.CloudStorage&&TG.CloudStorage.getItem){TG.CloudStorage.getItem(KEY,(e,v)=>apply(e?null:v));return;}}catch(e){}
  let v=null;try{v=localStorage.getItem(KEY);}catch(e){}apply(v);}

const needXp=l=>Math.floor(90*Math.pow(l,1.42));

const companion=()=>S.pelEq?S.peli.find(p=>p.u===S.pelEq):null;
const pelDef=p=>p?CFG.pelicans.find(x=>x.id===p.id):null;
function perkVal(type){const c=companion();if(!c)return 0;const d=pelDef(c);if(!d||d.perk.t!==type)return 0;
  return d.perk.v*(1+(c.lv||0)*.08);}
const pelStat=(p,w)=>{const d=pelDef(p);if(!d)return 0;const R=CFG.pelicanRarity[d.r];
  const base=w==='atk'?2+d.r*2:w==='def'?1+d.r*1.4:1+d.r*.8;
  return Math.round(base*R.m*(1+(p.lv||0)*.18));};
const regRate=()=>(CFG.enPerMin+S.up.reg*.3)*(1+perkVal('energy')/100);

function rollR(luck){const bonus=buffOn('luk')?1.5:1;
  const w=CFG.rarity.map((r,i)=>i>=2?r.w*(1+luck*.022)*bonus:r.w);
  const tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(let i=0;i<w.length;i++)if((x-=w[i])<=0)return i;return 0;}

  const sc=R.m*(1+S.lvl*.13);if(r>S.bestR)S.bestR=r;
  return{u:S.uid++,k:kk,r,lv:0,n:K.names[Math.min(r,K.names.length-1)],
    a:Math.round(K.a*sc),d:Math.round(K.d*sc),l:r>=3?r-1:0,s:Math.round(45*R.m*(1+S.lvl*.22))};}

/* ══════════ 8. boss ══════════ */
const curBoss=()=>CFG.bosses.find(b=>b.id===S.bossSel)||CFG.bosses[0];
const bossMax=b=>Math.round((420+S.lvl*260+Math.pow(S.lvl,1.8)*8)*b.hpM);
function bossReset(id){id=id||S.bossSel;const b=CFG.bosses.find(x=>x.id===id)||CFG.bosses[0];

function renderBossRow(){$('bossrow').innerHTML=CFG.bosses.map(b=>{const lock=S.lvl<b.lvl;

function renderBoss(){renderBossRow();
  const b=curBoss(),lock=S.lvl<b.lvl,st=lock?null:bossReset(b.id);

  $('attack').disabled=lock||st.dead;$('attack10').disabled=lock||st.dead;
  $('attack').textContent=lock?t('loc_lock',b.lvl):st.dead?t('b_tomorrow'):t('b_attack');
  $('attack10').textContent=t('b_attack10');
  $('bosshint').textContent=lock?t('loc_lock',b.lvl):st.dead?t('b_claimed'):
    (ph?t('b_hint2',ph+1):`Weakness: ${b.weak}. Attack: ${b.style}.`);
  const coinR=Math.round((700+S.lvl*260)*b.coinM),xpR=Math.round((140+S.lvl*45)*b.xpM);

  document.querySelector('nav button[data-go="fight"]').classList.toggle('dot',!lock&&!st.dead&&S.en>=8);}
function hitBoss(times){const b=curBoss();if(S.lvl<b.lvl)return;const st=bossReset(b.id);if(st.dead)return;
  if(!spend(8*times))return;
  const stt=stats();let total=0,crits=0;
  for(let i=0;i<times;i++){if(st.hp<=0)break;
    const crit=Math.random()<(.05+stt.luck*.01);

    if(buffOn('dmg'))d*=1.5;
    d*=(1+perkVal('bossdmg')/100);
    d=Math.round(d);total+=d;if(crit)crits++;
    st.hp=Math.max(0,st.hp-d);st.hits++;misReset();S.mis.hit++;}
  const f=$('bossface');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
  const w=f.parentElement;w.style.position='relative';

  p.style.setProperty('--dx',ri(-30,30)+'px');p.style.left='36%';p.style.top='30px';
  p.style.color=crits?'var(--gold)':'var(--pink)';
  w.appendChild(p);setTimeout(()=>p.remove(),1000);
  hap(crits?'heavy':'light');
  if(st.hp<=0&&!st.dead){st.dead=true;S.kills++;if(!S.bossSeen.includes(b.id))S.bossSeen.push(b.id);
    const c=Math.round((700+S.lvl*260)*b.coinM),xp=Math.round((140+S.lvl*45)*b.xpM);
    gain(c,b.pts);addXp(xp);
    const it=makeItem(stats().luck+6);addItem(it);notif('success');confetti(40);
    openModal(`<h2>${t('b_down')}</h2><div class="rays"><div class="em">💀</div></div>
      <p class="muted" style="text-align:center">🪙 +${fmt(c)} · 💠 +${b.pts}</p>${itemCard(it)}
      <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_flyon')}</button>`);}
  paint();}
$('attack').onclick=()=>hitBoss(1);
$('attack10').onclick=()=>hitBoss(10);

/* ══════════ 9. sparring — turn-based duel ══════════ */
let sparring=false,pendingAction=null;
function logLine(txt,c){const l=$('log');const d=document.createElement('div');
  d.innerHTML=c?`<span style="color:${c}">${txt}</span>`:txt;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function chooseAction(a){if(pendingAction){const r=pendingAction;pendingAction=null;r(a);}}
$('aAtk').onclick=()=>chooseAction('atk');
$('aPow').onclick=()=>chooseAction('pow');
$('aDef').onclick=()=>chooseAction('def');
$('aUlt').onclick=()=>chooseAction('ult');
function drawStam(v){const el=$('stamfill');el.style.width=clamp(v,0,100)+'%';el.classList.toggle('full',v>=100);}
function setActs(v){$('aAtk').disabled=false;$('aPow').disabled=v<40;$('aDef').disabled=false;$('aUlt').disabled=v<100;}
async function spar(){if(sparring)return;if(!spend(15))return;
  sparring=true;$('spar').style.display='none';$('log').innerHTML='';
  $('stamwrap').style.display='block';$('actrow').style.display='grid';
  const st=stats(),arenaMul=1+perkVal('arenadmg')/100;
  const tier=CFG.foes[clamp(Math.floor(S.lvl/5)+ri(0,1),0,CFG.foes.length-1)];
  const foe={n:tier.n,e:tier.e,tr:tier.tr,atk:Math.round(st.atk*tier.p*(.9+Math.random()*.25)),
    def:Math.round(st.def*tier.p*.8),hp:Math.round(st.hp*tier.p*(.9+Math.random()*.2))};
  const foeMax=foe.hp;let myHp=st.hp,myStam=40,shieldUsed=false;
  $('foeFace').textContent=foe.e;$('foeName').textContent=foe.n.toUpperCase();
  const draw=()=>{$('myhp').style.width=clamp(myHp/st.hp*100,0,100)+'%';
    $('foehp').style.width=clamp(foe.hp/foeMax*100,0,100)+'%';
    $('myhptxt').textContent=Math.max(0,Math.round(myHp))+' HP';
    $('foehptxt').textContent=Math.max(0,Math.round(foe.hp))+' HP';};
  draw();drawStam(myStam);logLine(t('spar_in',foe.n),'#FF2E97');
  if(foe.tr)logLine(t('trait_'+foe.tr),'#29E5D0');
  await wait(500);
  let round=1;
  while(myHp>0&&foe.hp>0&&round<=20){
    setActs(myStam);
    const action=await new Promise(res=>{pendingAction=res;});
    $('aAtk').disabled=$('aPow').disabled=$('aDef').disabled=$('aUlt').disabled=true;
    let defending=false,riposteChance=0;
    if(action==='atk'){
      myStam=Math.min(100,myStam+18);
      const crit=Math.random()<(.05+st.luck*.012);
      let d=st.atk*arenaMul*(.85+Math.random()*.3)*(1-foe.def/(foe.def+70))*(crit?2:1);
      d=Math.max(1,Math.round(d));
      if(foe.tr==='shield'&&!shieldUsed){d=Math.round(d*.3);shieldUsed=true;logLine(t('trait_shield'),'#6CC8FF');}
      foe.hp-=d;draw();logLine(t('spar_hit','<b>'+d+'</b>')+(crit?' 💥':''),'#7CFF3D');hap('light');
    }else if(action==='pow'){
      myStam=Math.max(0,myStam-40);
      if(Math.random()<.82){
        let d=st.atk*arenaMul*1.75*(.85+Math.random()*.3)*(1-(foe.def*.75)/((foe.def*.75)+70));
        d=Math.max(1,Math.round(d));
        if(foe.tr==='shield'&&!shieldUsed){d=Math.round(d*.3);shieldUsed=true;logLine(t('trait_shield'),'#6CC8FF');}
        foe.hp-=d;draw();logLine(t('spar_hit','<b>💥'+d+'</b>'),'#FF2E97');hap('medium');
      }else{logLine('· · ·','#888');hap('light');}
    }else if(action==='def'){
      defending=true;myStam=Math.min(100,myStam+26);riposteChance=.3;logLine('🛡️','#6CC8FF');
    }else if(action==='ult'){
      myStam=0;let d=Math.round(st.atk*arenaMul*2.6);
      if(foe.tr==='shield'&&!shieldUsed){shieldUsed=true;logLine(t('trait_shield'),'#6CC8FF');}
      foe.hp-=d;draw();logLine('<b>'+t('t_ultuse',d)+'</b>','#FFC53D');hap('heavy');notif('success');
    }
    draw();drawStam(myStam);await wait(380);
    if(foe.hp<=0)break;
    const hpPct=foe.hp/foeMax,w=hpPct<.3?{pow:.45,def:.15}:{pow:.25,def:.2};
    const roll=Math.random();const facc=roll<w.pow?'pow':roll<w.pow+w.def?'def':'atk';
    const berserkMul=foe.tr==='berserk'?1+(1-hpPct)*.6:1;
    if(facc==='def'){
      logLine(t('t_foedef',foe.n),'#888');
    }else{
      let e=foe.atk*berserkMul*(facc==='pow'?1.6:1)*(.85+Math.random()*.3)*(1-st.def/(st.def+70));
      e=Math.max(1,Math.round(e));if(defending)e=Math.round(e*.35);
      myHp-=e;draw();
      logLine(t('spar_back',foe.n,'<b>'+e+'</b>')+(defending?' · '+t('t_block',e):''),'#FF7AB8');
      if(foe.tr==='vamp'){const heal=Math.round(e*.3);foe.hp=Math.min(foeMax,foe.hp+heal);draw();logLine('🩸 +'+heal,'#FF6BB5');}
      if(foe.tr==='swift'&&Math.random()<.35&&myHp>0){
        let e2=Math.round(foe.atk*berserkMul*.5*(.85+Math.random()*.3)*(1-st.def/(st.def+70)));
        if(defending)e2=Math.round(e2*.35);
        myHp-=e2;draw();logLine(t('spar_back',foe.n,'<b>'+e2+'</b>'),'#FF7AB8');
      }
    }
    if(defending&&Math.random()<riposteChance&&foe.hp>0){
      const rd=Math.max(1,Math.round(st.atk*arenaMul*.45));
      foe.hp-=rd;draw();logLine(t('t_riposte',rd),'#7CFF3D');
    }
    draw();await wait(380);round++;}
  $('actrow').style.display='none';$('stamwrap').style.display='none';
  if(foe.hp<=0&&myHp>0){S.wins++;misReset();S.mis.win++;
    const c=Math.round(280+S.lvl*90),pts=2,r=ri(8,16);
    S.rating+=r;gain(c,pts);addXp(30+S.lvl*10);
    logLine('<b>'+t('spar_win',fmt(c),pts,r)+'</b>','#FFC53D');notif('success');confetti(16);
    if(Math.random()<.22+perkVal('drop')/100){const it=makeItem(stats().luck);addItem(it);logLine(t('spar_drop',it.n),'#7CFF3D');}
  }else{S.losses++;const r=ri(4,9);S.rating=Math.max(800,S.rating-r);
    const c=Math.round(60+S.lvl*12);gain(c,0);
    logLine(t('spar_lose',r,fmt(c)),'#FF7AB8');notif('error');}
  sparring=false;$('spar').style.display='block';$('spar').disabled=false;$('spar').textContent=t('btn_find');paint();save();}
$('spar').onclick=spar;

const pelOwned=id=>S.peli.find(p=>p.id===id);
function renderPeliShop(){
  $('eggs').innerHTML=CFG.eggs.map(e=>{const cur=e.cur==='pts'?S.pts:S.coins,can=cur>=e.cost;

      ${can?'':'<div class="pity" style="opacity:.9">'+t('t_notenough',e.cur==='pts'?t('cur_pts'):t('cur_coins'))+'</div>'}</div>`;}).join('');
  const c=companion(),cd=pelDef(c);
  $('peliactive').textContent=c&&cd?(cd.e+' '+cd.n+' · '+t('peli_active')):t('peli_none');
  $('pelicount').textContent=S.peli.length+'/'+CFG.pelicans.length;
  $('pelis').innerHTML=CFG.pelicans.map(d=>{const owned=pelOwned(d.id),R=CFG.pelicanRarity[d.r];
    const active=owned&&S.pelEq===owned.u;
    return `<div class="pk ${R.c} ${active?'on':''} ${!owned?'locked':''}" data-pel="${d.id}">
      ${owned?'<span class="own">'+(active?'✅':'✓')+'</span>':''}
      ${owned&&owned.lv?'<span class="lv">+'+owned.lv+'</span>':''}
      <div class="em">${d.e}</div><div class="nm ${R.t}">${d.n}</div>
      <div class="tier">${t(R.dk)}</div>
      <div class="pr">${owned?(active?t('peli_active'):t('btn_equipc')):(d.buy.cur==='pts'?'💠 '+d.buy.cost:'🪙 '+fmt(d.buy.cost))}</div></div>`;}).join('');}
function peliModal(d){
  const owned=pelOwned(d.id),R=CFG.pelicanRarity[d.r],active=owned&&S.pelEq===owned.u,lv=owned?(owned.lv||0):0;
  const perkV=d.perk.v*(1+lv*.08);
  const lvCost=Math.round(260*(lv+1)*R.m),featherCost=(d.r+1)*(lv+1)*3;
  const canLv=owned&&lv<10&&S.coins>=lvCost&&S.res.feather>=featherCost;
  const buyCur=d.buy.cur==='pts'?S.pts:S.coins,canBuy=!owned&&buyCur>=d.buy.cost;
  let body=`<h2 class="${R.t}">${d.e} ${d.n}</h2>
    <p class="muted" style="text-align:center">${t(R.dk)}${owned?' · Lv '+lv:''}<br>
    +${pelStat({id:d.id,lv},'atk')} ${t('c_atk')} · +${pelStat({id:d.id,lv},'def')} ${t('c_def')} · +${pelStat({id:d.id,lv},'luck')} 🍀<br>
    ${t('perk_'+d.perk.t,Math.round(perkV))}</p>`;
  if(owned){
    body+=`<button class="btn green" id="pEq" style="margin-top:10px">${active?t('btn_unequipc'):t('btn_equipc')}</button>
      <button class="btn" id="pLv" ${canLv?'':'disabled'}>${lv>=10?t('maxlvl'):t('btn_lvup',lv+1,fmt(lvCost),featherCost)}</button>
      <button class="btn pale" onclick="closeModal()">${t('btn_close')}</button>`;
  }else{
    body+=`<button class="btn green" id="pBuy" ${canBuy?'':'disabled'} style="margin-top:10px">${t('btn_buy',d.buy.cur==='pts'?'💠 '+d.buy.cost:'🪙 '+fmt(d.buy.cost))}</button>
      <button class="btn pale" onclick="closeModal()">${t('btn_close')}</button>`;
  }
  openModal(body);
  if(owned){
    $('pEq').onclick=()=>{S.pelEq=active?null:owned.u;closeModal();hap('medium');paint();};
    $('pLv').onclick=()=>{if(!canLv)return;S.coins-=lvCost;S.res.feather-=featherCost;owned.lv=(owned.lv||0)+1;
      misReset();S.mis.upg++;hap('heavy');closeModal();paint();};
  }else{
    $('pBuy').onclick=()=>{if(!canBuy)return;if(d.buy.cur==='pts')S.pts-=d.buy.cost;else S.coins-=d.buy.cost;
      S.peli.push({u:S.pelUid++,id:d.id,lv:0});confetti(d.r>=4?30:14);hap('medium');toast(t('peli_new'));closeModal();paint();};
  }}
function rollEggTier(e){const tot=e.w.reduce((a,b)=>a+b,0);let x=Math.random()*tot;
  for(let i=0;i<e.w.length;i++){if((x-=e.w[i])<=0)return e.tiers[i];}return e.tiers[e.tiers.length-1];}
function openEgg(id){
  const e=CFG.eggs.find(x=>x.id===id);if(!e)return;
  const cur=e.cur==='pts'?S.pts:S.coins;
  if(cur<e.cost){toast(t('t_notenough',e.cur==='pts'?t('cur_pts'):t('cur_coins')));return;}
  if(e.cur==='pts')S.pts-=e.cost;else S.coins-=e.cost;
  misReset();S.mis.egg++;
  S.pity[id]=(S.pity[id]||0)+1;
  let tier=rollEggTier(e);
  if(S.pity[id]>=e.pity&&tier<e.pityR)tier=e.pityR;
  if(tier>=e.pityR)S.pity[id]=0;
  let pool=CFG.pelicans.filter(p=>p.r===tier);
  if(!pool.length)pool=CFG.pelicans.filter(p=>p.r===e.tiers[0]);
  const d=pool[ri(0,pool.length-1)],owned=pelOwned(d.id),R=CFG.pelicanRarity[d.r];
  hap('medium');
  if(owned){
    const featherGain=(d.r+1)*8+5;S.res.feather=(S.res.feather||0)+featherGain;
    notif('success');confetti(d.r>=4?20:10);
    openModal(`<h2 class="${R.t}">${d.e} ${d.n}</h2><div class="rays"><div class="em">${e.i}</div></div>
      <p class="muted" style="text-align:center">${t(R.dk)}<br>${t('peli_dup',featherGain)}</p>
      <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_close')}</button>`);
  }else{
    S.peli.push({u:S.pelUid++,id:d.id,lv:0});
    notif('success');confetti(d.r>=4?34:16);
    openModal(`<h2 class="${R.t}">${d.e} ${d.n}</h2><div class="rays"><div class="em">${e.i}</div></div>
      <p class="muted" style="text-align:center">${t(R.dk)}<br><b style="color:var(--neon)">${t('peli_new')}</b></p>
      <button class="btn green" onclick="closeModal()" style="margin-top:12px">${t('btn_close')}</button>`);
  }
  paint();save();}

/* ══════════ 11. clicks ══════════ */
document.addEventListener('click',e=>{const el=e.target;
  const mis=el.closest('[data-mis]');
  if(mis){const m=CFG.missions.find(x=>x.id===mis.dataset.mis);
    if(m&&!S.mis.got.includes(m.id)&&S.mis[m.key]>=m.goal){S.mis.got.push(m.id);gain(m.c,m.p);hap('medium');confetti(12);toast(t('t_mission'));paint();}return;}
  const ach=el.closest('[data-ach]');
  if(ach){const a=CFG.achs.find(x=>x.id===ach.dataset.ach);
    if(a&&a.f(S)&&!S.ach.includes(a.id)){S.ach.push(a.id);gain(a.c,a.p);notif('success');confetti(18);toast(t('t_ach',a.n));paint();}return;}
  const hq=el.closest('[data-hq]');
  if(hq){const b=CFG.hq.find(x=>x.id===hq.dataset.hq),l=S.hq[b.id]||0;
    const cost=Math.round(b.cost*Math.pow(b.m,l)),need=Object.entries(b.res).map(([k,v])=>[k,Math.round(v*Math.pow(1.5,l))]);
    if(S.coins<cost||!need.every(([k,v])=>S.res[k]>=v))return;
    S.coins-=cost;need.forEach(([k,v])=>S.res[k]-=v);S.hq[b.id]=l+1;hap('medium');paint();return;}
  const up=el.closest('[data-up]');
  if(up){const u=CFG.ups.find(x=>x.id===up.dataset.up),c=upCost(u);
    if(S.coins<c)return;S.coins-=c;S.up[u.id]++;if(u.id==='cap')S.en+=10;hap('medium');paint();return;}
  const loc=el.closest('[data-loc]');
  if(loc){const l=CFG.locations.find(x=>x.id===loc.dataset.loc);
    if(S.run||S.lvl<l.lvl||!spend(l.en))return;
    S.run={id:l.id,end:Date.now()+l.sec*1000};hap('medium');paint();return;}
  const it=el.closest('[data-it]');
  if(it){const i=S.inv.find(x=>x.u===+it.dataset.it);if(i)itemModal(i);return;}
  const bo=el.closest('[data-bo]');
  if(bo){const b=CFG.boosters.find(x=>x.id===bo.dataset.bo);
    const cur=b.cur==='pts'?S.pts:S.coins;if(cur<b.cost)return;
    if(b.cur==='pts')S.pts-=b.cost;else S.coins-=b.cost;
    if(b.id==='ref'){S.en=enMax();toast(t('t_refilled'));}
    else{S.buff[b.id]=Math.max(Date.now(),S.buff[b.id]||0)+b.mins*60000;toast(t('t_boostact',b.n));}
    misReset();S.mis.boost++;hap('medium');paint();return;}
  const sk=el.closest('[data-sk]');
  if(sk){const s=CFG.skins.find(x=>x.id===sk.dataset.sk);
    if(!S.own.includes(s.id)){const cur=s.cur==='pts'?S.pts:S.coins;
      if(cur<s.cost){toast(t('t_notenough',s.cur==='pts'?t('cur_pts'):t('cur_coins')));return;}
      if(s.cur==='pts')S.pts-=s.cost;else S.coins-=s.cost;
      S.own.push(s.id);confetti(14);toast(t('t_unlocked',s.n));}
    S.skin[s.s]=S.skin[s.s]===s.id?null:s.id;hap('medium');drawPel();paint();return;}
  const bch=el.closest('[data-boss]');
  if(bch){const b=CFG.bosses.find(x=>x.id===bch.dataset.boss);
    if(!b||S.lvl<b.lvl){if(b)toast(t('loc_lock',b.lvl));return;}
    S.bossSel=b.id;hap();paint();return;}
  const pk=el.closest('[data-pel]');
  if(pk){const d=CFG.pelicans.find(x=>x.id===pk.dataset.pel);if(d)peliModal(d);return;}
  const eg=el.closest('[data-egg]');
  if(eg){openEgg(eg.dataset.egg);return;}
  const lg=el.closest('[data-lg]');
  if(lg){setLang(lg.dataset.lg);hap('medium');closeModal();openSettings();return;}});

  $('b-coins').textContent=fmt(S.coins);$('b-pts').textContent=fmt(S.pts);
  $('b-atk').textContent=st.atk;$('b-def').textContent=st.def;
  $('lvl').textContent='LV '+S.lvl;

  const act=CFG.boosters.filter(b=>buffOn(b.id));
  $('buffs').innerHTML=act.map(b=>`<span class="buff">${b.i} ${b.n} · ${Math.ceil((S.buff[b.id]-Date.now())/60000)}m</span>`).join('');}
function paintEnergy(){regen();const m=enMax();
  $('enfill').style.width=clamp(S.en/m*100,0,100)+'%';
  $('entxt').textContent=Math.floor(S.en)+'/'+m;
  $('enhint').textContent=S.en>=m?t('en_full'):t('en_rate',regRate().toFixed(1),Math.ceil((m-S.en)/regRate()));}
function paintRun(){const c=$('runcard');
  if(!S.run){c.style.display='none';document.querySelector('nav button[data-go="farm"]').classList.remove('dot');return;}
  const l=CFG.locations.find(x=>x.id===S.run.id),left=Math.max(0,S.run.end-Date.now());
  c.style.display='block';$('runname').textContent=l.i+' '+l.n;
  $('runbar').style.width=(100-left/(l.sec*1000)*100)+'%';
  $('runsub').textContent=t('run_exp',fmt(l.coin[0])+'–'+fmt(l.coin[1]),Math.round(l.drop*100));
  const b=$('collect');b.disabled=left>0;
  b.textContent=left>0?t('run_back',Math.ceil(left/1000)):t('run_collect');
  document.querySelector('nav button[data-go="farm"]').classList.toggle('dot',left<=0);}
function paint(){paintTop();paintEnergy();paintRun();
  renderMis();renderAch();renderHQ();renderUp();renderLocs();renderBag();renderBoss();renderShop();renderPeliShop();
  $('arenarec').textContent=t('rating',S.rating,S.wins,S.losses);
  $('spar').textContent=t('btn_find');
  $('meName').textContent=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.first_name)?TG.initDataUnsafe.user.first_name.toUpperCase():t('you');
  $('res').innerHTML=CFG.resList.map(([k,e])=>`<div><span>${e}</span><b>${fmt(S.res[k])}</b></div>`).join('');
  if(S.tap.date!==today())S.tap={date:today(),n:0};
  $('tapmeter').textContent=t('taps',S.tap.n,CFG.tapCap);
  save();}

/* ══════════ 13. boot ══════════ */
load(()=>{
  const u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
  if(!S.lang){const c=(u&&u.language_code||navigator.language||'en').slice(0,2);
    S.lang=LANGS.some(x=>x.c===c)?c:'en';}
  LI=Math.max(0,LANGS.findIndex(x=>x.c===S.lang));
  if(u)$('nick').textContent=(u.first_name||u.username||'PELICAN').toUpperCase();
  applyStatic();regen();bossReset();misReset();
  if(S.run&&Date.now()>S.run.end+864e5)S.run=null;
  drawPel();paint();
  const{h,out}=hqPending();
  setTimeout(()=>{$('splash').classList.add('gone');
    if(h>.25&&Object.values(out).some(v=>v>=1)){
      openModal(`<h2>${t('off_title')}</h2><div class="rays"><div class="em">🏚️</div></div>
        <p class="muted" style="text-align:center">${t('off_note',h.toFixed(1))}<br>
        ${hqSummary(out)}</p>
        <button class="btn green" id="cn" style="margin-top:12px">${t('hq_collect')}</button>`);
      $('cn').onclick=()=>{$('collectNest').click();closeModal();setTimeout(checkDaily,300);};
    }else setTimeout(checkDaily,400);},1500);
  setInterval(()=>{paintTop();paintEnergy();paintRun();if($('s-home').classList.contains('on'))renderHQ();},1000);
});
</script>
</body>
</html>
